document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Mis Hábitos<\u002Ftitle>\n<script src=\"0722af2e-e1bf-41a5-9a8c-d42a7732c801\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"apple-mobile-web-app-title\" content=\"Hábitos\">\n<meta name=\"theme-color\" content=\"#08080c\">\n<style>\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}\nhtml,body{margin:0;padding:0;}\nbody{background:#08080c;}\ninput::placeholder{color:#62636e;}\n@keyframes flameFlick{\n  0%,100%{transform:rotate(45deg) scale(1,1);}\n  25%{transform:rotate(45deg) scale(0.95,1.07) translate(2%,-2%);}\n  50%{transform:rotate(45deg) scale(1.06,0.94);}\n  75%{transform:rotate(45deg) scale(0.97,1.03) translate(-2%,0);}\n}\n@keyframes glowPulse{0%,100%{opacity:0.65;transform:translateX(-50%) scale(1);}50%{opacity:1;transform:translateX(-50%) scale(1.12);}}\n@keyframes burstRing{0%{opacity:0.85;transform:translateX(-50%) scale(0.35);}100%{opacity:0;transform:translateX(-50%) scale(2.1);}}\n@keyframes sparkUp{0%{opacity:1;transform:translate(-50%,0) scale(1);}100%{opacity:0;transform:translate(-50%,-46px) scale(0.4);}}\n@keyframes todayPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,122,24,0.0);}50%{box-shadow:0 0 0 4px rgba(255,122,24,0.14);}}\n@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(0.985);}to{opacity:1;transform:none;}}\n@keyframes emberRise{0%{transform:translateY(0) translateX(0) scale(0.5);opacity:0;}12%{opacity:1;}86%{opacity:1;}100%{transform:translateY(-90vh) translateX(16px) scale(1.05);opacity:0;}}\n@keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}\n@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1;}80%{opacity:1;}100%{transform:translateY(104vh) rotate(560deg);opacity:0;}}\n@keyframes bannerPop{0%{transform:translate(-50%,-50%) scale(0.4);opacity:0;}55%{opacity:1;}70%{transform:translate(-50%,-50%) scale(1.06);}100%{transform:translate(-50%,-50%) scale(1);opacity:1;}}\n@keyframes numPop{0%{transform:scale(1);}32%{transform:scale(1.3);}60%{transform:scale(0.94);}100%{transform:scale(1);}}\n@keyframes statIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}\n@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}\n@keyframes popIn{0%{transform:scale(0.4);opacity:0;}60%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}\n@keyframes growUp{from{transform:scaleY(0);}to{transform:scaleY(1);}}\n@keyframes heatIn{from{opacity:0;}to{opacity:1;}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;width:100%;position:relative;background:transparent;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#f3f3f6;padding:46px 18px 122px;\">\n  <canvas ref=\"{{ wpRef }}\" style=\"position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block;pointer-events:none;\"><\u002Fcanvas>\n  <div style=\"position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(135% 75% at 50% 0%, rgba(8,8,12,0.6), transparent 52%), radial-gradient(100% 60% at 50% 100%, rgba(8,8,12,0.5), transparent 58%);\"><\u002Fdiv>\n  <div style=\"position:fixed;top:14px;right:14px;z-index:45;display:flex;align-items:center;gap:9px;background:rgba(16,16,22,0.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);border-radius:999px;padding:7px 11px 7px 13px;box-shadow:0 8px 24px rgba(0,0,0,0.4);\">\n    <span style=\"font-size:11px;font-weight:700;color:#d6d7df;letter-spacing:0.3px;min-width:62px;\">{{ wpName }}<\u002Fspan>\n    <div style=\"display:flex;gap:6px;\">\n      <sc-for list=\"{{ wallpapers }}\" as=\"wp\" hint-placeholder-count=\"6\">\n        <button onclick=\"{{ wp.onPick }}\" aria-label=\"{{ wp.name }}\" title=\"{{ wp.name }}\" style=\"width:22px;height:22px;border-radius:50%;cursor:pointer;background:{{ wp.sw }};border:{{ wp.ring }};box-shadow:0 2px 8px rgba(0,0,0,0.45);transition:transform 0.15s ease;padding:0;\" style-hover=\"transform:scale(1.18)\"><\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  {{ celebrationEl }}\n  <sc-if value=\"{{ showUndo }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:14px;background:rgba(26,26,35,0.97);border:1px solid rgba(255,255,255,0.1);box-shadow:0 18px 44px rgba(0,0,0,0.6);border-radius:14px;padding:11px 12px 11px 16px;animation:fadeIn 0.25s ease both;\">\n      <span style=\"font-size:13px;color:#d6d7df;font-weight:500;\">🗑 Hábito eliminado<\u002Fspan>\n      <button onclick=\"{{ onUndoDelete }}\" style=\"padding:7px 14px;border-radius:9px;background:linear-gradient(135deg,#ffb24d,#ff6a13);border:none;color:#1a1206;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;\">Deshacer<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ showToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:rgba(26,26,35,0.97);border:1px solid rgba(255,255,255,0.1);box-shadow:0 18px 44px rgba(0,0,0,0.6);border-radius:12px;padding:12px 18px;font-size:13px;font-weight:700;color:#eaeaef;animation:fadeIn 0.25s ease both;\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"max-width:620px;margin:0 auto;position:relative;z-index:1;\">\n\n    <div style=\"margin-bottom:26px;\">\n      <div style=\"display:flex;align-items:center;gap:12px;\">\n        <span style=\"font-size:34px;line-height:1;filter:drop-shadow(0 4px 14px rgba(255,90,0,0.55));\">🔥<\u002Fspan>\n        <h1 style=\"margin:0;font-size:34px;font-weight:900;letter-spacing:-0.6px;color:#f6f6f9;\">Mis Hábitos<\u002Fh1>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;margin:10px 0 0;flex-wrap:wrap;\">\n        <span style=\"font-size:17px;color:#cfa66a;font-weight:800;letter-spacing:-0.2px;\">{{ greetingMain }}<\u002Fspan>\n        <button onclick=\"{{ onEditName }}\" aria-label=\"Editar nombre\" style=\"width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);color:#80818c;font-size:11px;cursor:pointer;transition:all 0.18s;\" style-hover=\"background:rgba(255,178,77,0.14);border-color:rgba(255,178,77,0.4);color:#ffc46b;\">✎<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"margin:5px 0 0;font-size:13px;color:#8a8a99;font-weight:500;\">{{ greetingSub }}<\u002Fp>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ tabHoy }}\" hint-placeholder-val=\"{{ true }}\">\n    <sc-if value=\"{{ askingName }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:linear-gradient(180deg, rgba(30,30,41,0.92), rgba(17,17,24,0.92));border:1px solid rgba(255,178,77,0.26);border-radius:18px;padding:16px;margin-bottom:22px;animation:cardIn 0.4s ease both;\">\n        <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px;\">\n          <span style=\"font-size:20px;\">👋<\u002Fspan>\n          <div style=\"font-size:14.5px;font-weight:800;color:#f4f4f7;\">¿Cómo te llamás?<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:9px;align-items:center;\">\n          <input value=\"{{ nameDraft }}\" onchange=\"{{ onChangeNameDraft }}\" placeholder=\"Tu nombre\" style=\"flex:1;min-width:0;padding:12px 13px;border-radius:12px;background:rgba(0,0,0,0.32);border:1px solid rgba(255,255,255,0.1);color:#fff;font-size:14.5px;font-family:inherit;outline:none;\">\n          <button onclick=\"{{ onSaveName }}\" style=\"flex:none;padding:12px 18px;border-radius:12px;background:linear-gradient(135deg,#ffb24d,#ff6a13);border:none;color:#1a1206;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;\">Guardar<\u002Fbutton>\n          <button onclick=\"{{ onSkipName }}\" aria-label=\"Omitir\" style=\"flex:none;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:#9293a0;font-size:15px;cursor:pointer;font-family:inherit;\">✕<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ hasHabits }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-bottom:14px;display:flex;align-items:center;gap:16px;background:linear-gradient(180deg, rgba(30,30,41,0.78), rgba(17,17,24,0.78));border:1px solid rgba(255,255,255,0.06);border-radius:18px;padding:16px 18px;animation:statIn 0.5s ease both;\">\n        <div style=\"flex:none;width:72px;height:72px;border-radius:50%;background:{{ summaryRingBg }};display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,0.4);\">\n          <div style=\"width:56px;height:56px;border-radius:50%;background:#13131a;display:flex;align-items:center;justify-content:center;\">\n            <span style=\"font-size:18px;font-weight:900;color:#f4f4f7;letter-spacing:-0.5px;\">{{ summaryRingText }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"min-width:0;\">\n          <div style=\"font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#8a8a99;\">Hoy<\u002Fdiv>\n          <div style=\"font-size:16px;font-weight:800;color:#f4f4f7;margin-top:3px;text-wrap:pretty;\">{{ ringMsg }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:9px;margin-bottom:9px;\">\n        <div style=\"flex:1;background:linear-gradient(180deg, rgba(30,30,41,0.78), rgba(17,17,24,0.78));border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:13px 12px;text-align:center;animation:statIn 0.5s ease 0.06s both;\">\n          <div style=\"font-size:24px;font-weight:900;line-height:1;color:#f4f4f7;letter-spacing:-0.5px;\">{{ summaryTotal }}<\u002Fdiv>\n          <div style=\"font-size:10.5px;font-weight:600;color:#8a8a99;margin-top:5px;letter-spacing:0.2px;\">cumplidos<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;background:linear-gradient(180deg, rgba(30,30,41,0.78), rgba(17,17,24,0.78));border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:13px 12px;text-align:center;animation:statIn 0.5s ease 0.12s both;\">\n          <div style=\"font-size:24px;font-weight:900;line-height:1;color:#ffb24d;letter-spacing:-0.5px;\">{{ summaryBest }}<\u002Fdiv>\n          <div style=\"font-size:10.5px;font-weight:600;color:#8a8a99;margin-top:5px;letter-spacing:0.2px;\">récord histórico<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;background:linear-gradient(180deg, rgba(30,30,41,0.78), rgba(17,17,24,0.78));border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:13px 12px;text-align:center;animation:statIn 0.5s ease 0.18s both;\">\n          <div style=\"font-size:24px;font-weight:900;line-height:1;color:#86e29a;letter-spacing:-0.5px;\">{{ summaryActive }}<\u002Fdiv>\n          <div style=\"font-size:10.5px;font-weight:600;color:#8a8a99;margin-top:5px;letter-spacing:0.2px;\">en racha<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:9px;margin-bottom:24px;\">\n        <div style=\"flex:1;background:linear-gradient(180deg, rgba(30,30,41,0.78), rgba(17,17,24,0.78));border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:12px;text-align:center;animation:statIn 0.5s ease 0.24s both;\">\n          <div style=\"font-size:17px;font-weight:900;line-height:1.2;color:#7fe6ff;letter-spacing:-0.2px;\">{{ statBestDay }}<\u002Fdiv>\n          <div style=\"font-size:10.5px;font-weight:600;color:#8a8a99;margin-top:4px;letter-spacing:0.2px;\">tu mejor día<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;background:linear-gradient(180deg, rgba(30,30,41,0.78), rgba(17,17,24,0.78));border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:12px;text-align:center;animation:statIn 0.5s ease 0.3s both;\">\n          <div style=\"font-size:17px;font-weight:900;line-height:1.2;color:#c79bff;letter-spacing:-0.2px;\">{{ statMonthPct }}<\u002Fdiv>\n          <div style=\"font-size:10.5px;font-weight:600;color:#8a8a99;margin-top:4px;letter-spacing:0.2px;\">cumplimiento del mes<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex;flex-direction:column;gap:16px;\">\n      <sc-for list=\"{{ habits }}\" as=\"habit\" hint-placeholder-count=\"1\">\n        <div draggable=\"{{ true }}\" sc-camel-on-drag-start=\"{{ habit.onDragStart }}\" sc-camel-on-drag-over=\"{{ habit.onDragOver }}\" sc-camel-on-drop=\"{{ habit.onDrop }}\" sc-camel-on-drag-end=\"{{ habit.onDragEnd }}\" style=\"background:linear-gradient(180deg, rgba(30,30,41,0.94), rgba(17,17,24,0.94));border:{{ habit.cardBorder }};border-radius:24px;padding:20px;box-shadow:{{ habit.cardShadow }};animation:cardIn 0.5s cubic-bezier(0.2,0.8,0.2,1) both;transition:border 0.4s ease, box-shadow 0.4s ease, opacity .2s ease;opacity:{{ habit.arrastrando }};outline:{{ habit.dropBorde }};outline-offset:3px;\">\n\n          <div style=\"display:flex;align-items:flex-start;gap:13px;\">\n            <div title=\"Arrastrá la tarjeta para reordenar\" style=\"flex:none;align-self:center;color:#5a5b66;font-size:15px;line-height:1;cursor:grab;letter-spacing:-1px;\">⠿<\u002Fdiv>\n            <div style=\"font-size:25px;line-height:1;flex:none;margin-top:1px;filter:drop-shadow(0 3px 8px rgba(0,0,0,0.4));\">{{ habit.emoji }}<\u002Fdiv>\n            <div style=\"flex:1;min-width:0;\">\n              <div style=\"font-size:18px;font-weight:800;color:#f4f4f7;letter-spacing:-0.2px;text-wrap:pretty;\">{{ habit.name }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:none;display:flex;flex-direction:column;gap:3px;\">\n              <button onclick=\"{{ habit.onMoveUp }}\" disabled=\"{{ habit.cantUp }}\" aria-label=\"Subir\" style=\"width:34px;height:15px;border-radius:9px 9px 4px 4px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);color:{{ habit.upColor }};font-size:9px;line-height:1;cursor:{{ habit.upCursor }};transition:all 0.15s;\" style-hover=\"background:rgba(255,255,255,0.1)\">▲<\u002Fbutton>\n              <button onclick=\"{{ habit.onMoveDown }}\" disabled=\"{{ habit.cantDown }}\" aria-label=\"Bajar\" style=\"width:34px;height:15px;border-radius:4px 4px 9px 9px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);color:{{ habit.downColor }};font-size:9px;line-height:1;cursor:{{ habit.downCursor }};transition:all 0.15s;\" style-hover=\"background:rgba(255,255,255,0.1)\">▼<\u002Fbutton>\n            <\u002Fdiv>\n            <button onclick=\"{{ habit.onTogglePausaHab }}\" aria-label=\"{{ habit.pausaAria }}\" title=\"{{ habit.pausaAria }}\" style=\"flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);color:#80818c;font-size:12px;cursor:pointer;transition:all 0.18s;\" style-hover=\"background:rgba(127,193,255,0.14);border-color:rgba(127,193,255,0.4);color:#9fd0ff;\">{{ habit.pausaIcon }}<\u002Fbutton>\n            <button onclick=\"{{ habit.onStartEdit }}\" aria-label=\"Editar\" style=\"flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);color:#80818c;font-size:14px;cursor:pointer;transition:all 0.18s;\" style-hover=\"background:rgba(255,178,77,0.14);border-color:rgba(255,178,77,0.4);color:#ffc46b;\">✎<\u002Fbutton>\n            <button onclick=\"{{ habit.onAskDelete }}\" aria-label=\"Eliminar\" style=\"flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);color:#80818c;font-size:15px;cursor:pointer;transition:all 0.18s;\" style-hover=\"background:rgba(255,60,80,0.12);border-color:rgba(255,60,80,0.35);color:#ff8a98;\">🗑<\u002Fbutton>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ habit.confirming }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,42,62,0.09);border:1px solid rgba(255,64,84,0.32);border-radius:14px;padding:10px 12px;margin-top:14px;animation:fadeIn 0.25s ease both;\">\n              <span style=\"font-size:12.5px;color:#ffb4be;font-weight:500;\">¿Eliminar este hábito y su progreso?<\u002Fspan>\n              <div style=\"display:flex;gap:8px;flex:none;\">\n                <button onclick=\"{{ habit.onCancelDelete }}\" style=\"padding:7px 12px;border-radius:9px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:#c9cad3;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;\">Cancelar<\u002Fbutton>\n                <button onclick=\"{{ habit.onConfirmDelete }}\" style=\"padding:7px 12px;border-radius:9px;background:#e3324c;border:none;color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;\">Eliminar<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ habit.editing }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:rgba(255,178,77,0.06);border:1px solid rgba(255,178,77,0.28);border-radius:14px;padding:13px;margin-top:14px;animation:fadeIn 0 :inherit;font-size:12.5px;font-weight:800;cursor:pointer;transition:all 0.18s;background:{{ editDailyBg }};color:{{ editDailyFg }};\">📅 Diario<\u002Fbutton>\n                  <button onclick=\"{{ onEditWeekly }}\" style=\"flex:1;padding:9px;border-radius:10px;border:none;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;transition:all 0.18s;background:{{ editWeeklyBg }};color:{{ editWeeklyFg }};\">🗓️ Semanal<\u002Fbutton>\n                  <button onclick=\"{{ onEditTimes }}\" style=\"flex:1;padding:9px;border-radius:10px;border:none;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;transition:all 0.18s;background:{{ editTimesBg }};color:{{ editTimesFg }};\">🎯 Flexible<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ editTimesOn }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;animation:fadeIn 0.2s ease both;\">\n                  <span style=\"font-size:11.5px;font-weight:600;color:#8a8a99;\">Veces por semana:<\u002Fspan>\n                  <div style=\"display:flex;gap:6px;\">\n                    <sc-for list=\"{{ editTargetOpts }}\" as=\"eto\" hint-placeholder-count=\"5\">\n                      <button onclick=\"{{ eto.onPick }}\" style=\"width:30px;height:30px;border-radius:9px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:all 0.15s;background:{{ eto.bg }};color:{{ eto.fg }};border:{{ eto.border }};\">{{ eto.n }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"height:5px;\"><\u002Fdiv>\n              <div style=\"display:flex;gap:8px;justify-content:flex-end;\">\n                <button onclick=\"{{ onCancelEdit }}\" style=\"padding:8px 14px;border-radius:10px;backgroun rgba(255,255,255,0.07);\">🏆 récord {{ habit.record }}<\u002Fspan>\n                <sc-if value=\"{{ habit.showWeek }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;background:rgba(255,255,255,0.05);color:#c4c5cf;border:1px solid rgba(255,255,255,0.07);\">📊 {{ habit.weekLabel }} esta semana<\u002Fspan>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ habit.showShield }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;background:{{ habit.shieldBg }};color:{{ habit.shieldColor }};border:{{ habit.shieldBorder }};\" title=\"El escudo cubre 1 día olvidado por cada 7 días cumplidos sin romper la racha\">{{ habit.shieldLabel }}<\u002Fspan>\n                <\u002Fsc-if>\n                <span style=\"font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;background:{{ habit.accentSoft }};color:{{ habit.numColor }};border:1px solid {{ habit.accent }};\">{{ habit.tierLabel }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin:-2px 0 17px;\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:10px;\">\n              <span style=\"font-size:11.5px;font-weight:600;color:#9293a0;text-wrap:pretty;\">{{ habit.progressLabel }}<\u002Fspan>\n              <span style=\"flex:none;font-size:11.5px;font-weight:800;color:{{ habit.numColor }};\">{{ habit.progressRight }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:7px;border-radius:999px;background:rgba(255,255,255,0.06);overflow:hidden;\">\n              <div style=\"height:100%;width:{{ habit.progressPct }};border-radius:999px;background:linear-gradient(90deg,{{ habit.progressFrom }},{{ habit.progressTo }});box-shadow:0 0 10px {{ habit.accentSoft }};transition:width 0.65s cubic-bezier(0.2,0.8,0.2,1);\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;\">\n            <span style=\"font-size:10.5px;font-weight:700;color:#6f7079;letter-spacing:0.3px;\">{{ habit.gridCaption }}<\u002Fspan>\n            <sc-if value=\"{{ habit.canMonthView }}\" hint-placeholder-val=\"{{ false }}\">\n              <button onclick=\"{{ habit.onToggleView }}\" style=\"flex:none;white-space:nowrap;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#9293a0;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.18s;\" style-hover=\"color:#ffc46b;border-color:rgba(255,178,77,0.4)\">{{ habit.viewToggleLabel }}<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat({{ habit.gridCols }},1fr);gap:4px;margin-bottom:16px;\">\n            <sc-for list=\"{{ habit.days }}\" as=\"day\" hint-placeholder-count=\"14\">\n              <button onclick=\"{{ day.onClick }}\" style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;aspect-ratio:{{ day.aspect }};border-radius:8px;cursor:pointer;font-family:inherit;transition:transform 0.18s ease, background 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;background:{{ day.bg }};color:{{ day.fg }};border:{{ day.border }};box-shadow:{{ day.glow }};animation:{{ day.anim }};\" style-hover=\"transform:translateY(-2px)\" style-active=\"transform:scale(0.88)\">\n                <span style=\"font-size:7px;font-weight:700;letter-spacing:0.2px;opacity:0.6;\">{{ day.dow }}<\u002Fspan>\n                <span style=\"font-size:10px;font-weight:800;\">{{ day.label }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ habit.enPausa }}\" hint-placeholder-val=\"{{ false }}\">\n            <button onclick=\"{{ habit.onTogglePausaHab }}\" style=\"width:100%;padding:15px;border-radius:15px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;background:rgba(127,193,255,0.1);color:#9fd0ff;border:1px dashed rgba(127,193,255,0.4);transition:filter 0.2s ease;\" style-hover=\"filter:brightness(1.12)\">▶ Reanudar hábito<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ habit.activo }}\" hint-placeholder-val=\"{{ true }}\">\n          <sc-if value=\"{{ habit.isWater }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px;\">\n              <sc-for list=\"{{ habit.glasses }}\" as=\"gl\" hint-placeholder-count=\"8\">\n                <button onclick=\"{{ gl.onClick }}\" aria-label=\"Vaso de agua\" style=\"width:36px;height:42px;border-radius:8px 8px 13px 13px;display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;font-family:inherit;transition:all 0.18s;background:{{ gl.bg }};border:{{ gl.border }};opacity:{{ gl.op }};\" style-hover=\"transform:translateY(-2px)\" style-active=\"transform:scale(0.88)\">💧<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:9px;\">\n              <button onclick=\"{{ habit.onWaterMinus }}\" aria-label=\"Quitar un vaso\" style=\"flex:none;width:54px;padding:15px 0;border-radius:15px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#c9cad3;font-size:20px;font-weight:800;cursor:pointer;font-family:inherit;transition:all 0.15s;\" style-hover=\"background:rgba(255,255,255,0.1)\" style-active=\"transform:scale(0.95)\">−<\u002Fbutton>\n              <button onclick=\"{{ habit.onWaterPlus }}\" style=\"flex:1;padding:15px;border-radius:15px;font-family:inherit;font-size:15px;font-weight:800;letter-spacing:0.1px;cursor:pointer;transition:transform 0.15s ease, filter 0.2s ease;background:{{ habit.waterBtnBg }};color:{{ habit.waterBtnFg }};border:1px solid transparent;box-shadow:0 12px 26px {{ habit.waterBtnShadow }};\" style-hover=\"filter:brightness(1.06);transform:translateY(-1px)\" style-active=\"transform:translateY(1px) scale(0.992)\">{{ habit.waterBtnText }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ habit.notWater }}\" hint-placeholder-val=\"{{ true }}\">\n            <button onclick=\"{{ habit.onMark }}\" style=\"width:100%;padding:15px;border-radius:15px;font-family:inherit;font-size:15px;font-weight:800;letter-spacing:0.1px;cursor:pointer;transition:transform 0.15s ease, filter 0.2s ease;background:{{ habit.btnBg }};color:{{ habit.btnFg }};border:{{ habit.btnBorder }};box-shadow:0 12px 26px {{ habit.btnShadow }};\" style-hover=\"filter:brightness(1.06);transform:translateY(-1px)\" style-active=\"transform:translateY(1px) scale(0.992)\">{{ habit.btnText }}<\u002Fbutton>\n          <\u002Fsc-if>\n          <\u002Fsc-if>\n\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ noHabits }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align:center;padding:46px 26px;border:1.5px dashed rgba(255,255,255,0.13);border-radius:24px;background:rgba(255,255,255,0.015);animation:cardIn 0.5s ease both;\">\n          <div style=\"font-size:48px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 6px 18px rgba(255,90,0,0.4));\">🪵<\u002Fdiv>\n          <div style=\"font-size:17px;font-weight:800;color:#e9e9ee;margin-bottom:7px;letter-spacing:-0.2px;\">Todavía no hay llamas encendidas<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#8a8a99;line-height:1.6;max-width:300px;margin:0 auto;text-wrap:pretty;\">Agregá tu primer hábito y empezá a construir tu racha. Un día a la vez. 🔥<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;\">\n            <sc-for list=\"{{ suggestions }}\" as=\"sg\" hint-placeholder-count=\"4\">\n              <button onclick=\"{{ sg.onPick }}\" style=\"padding:9px 14px;border-radius:999px;background:rgba(255,122,24,0.08);border:1px solid rgba(255,122,24,0.3);color:#ffb24d;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.18s;\" style-hover=\"background:rgba(255,122,24,0.16)\">{{ sg.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:16px;\">\n      <sc-if value=\"{{ adding }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:linear-gradient(180deg, rgba(30,30,41,0.94), rgba(17,17,24,0.94));border:1px solid rgba(255,255,255,0.09);border-radius:22px;padding:18px;box-shadow:0 22px 54px rgba(0,0,0,0.55);animation:cardIn 0.4s ease both;\">\n          <div style=\"font-size:14px;font-weight:800;color:#f4f4f7;margin-bottom:13px;\">Nuevo hábito<\u002Fdiv>\n          <input value=\"{{ draftName }}\" onchange=\"{{ onChangeName }}\" placeholder=\"¿Qué querés cumplir?\" style=\"width:100%;padding:13px 14px;border-radius:13px;background:rgba(0,0,0,0.32);border:1px solid rgba(255,255,255,0.1);color:#fff;font-size:15px;font-family:inherit;outline:none;margin-bottom:16px;\">\n          <div style=\"font-size:12px;font-weight:600;color:#8a8a99;margin-bottom:9px;\">¿Con qué frecuencia?<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;margin-bottom:12px;\">\n            <button onclick=\"{{ onAddDaily }}\" style=\"flex:1;padding:11px;border-radius:11px;border:none;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;transition:all 0.18s;background:{{ addDailyBg }};color:{{ addDailyFg }};\">📅 Diario<\u002Fbutton>\n            <button onclick=\"{{ onAddWeekly }}\" style=\"flex:1;padding:11px;border-radius:11px;border:none;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;tran \"display:flex;gap:10px;justify-content:flex-end;\">\n            <button onclick=\"{{ onCancelAdd }}\" style=\"padding:11px 18px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:#c9cad3;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;\">Cancelar<\u002Fbutton>\n            <button onclick=\"{{ onConfirmAdd }}\" disabled=\"{{ addDisabled }}\" style=\"padding:11px 20px;border-radius:12px;background:{{ addBtnBg }};border:none;color:{{ addBtnFg }};font-size:14px;font-weight:800;cursor:{{ addCursor }};font-family:inherit;transition:all 0.2s;\">Agregar hábito<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ notAdding }}\" hint-placeholder-val=\"{{ true }}\">\n        <button onclick=\"{{ onStartAdd }}\" style=\"width:100%;padding:18px;border-radius:18px;border:1.5px dashed rgba(255,255,255,0.16);background:rgba(255,255,255,0.015);color:#9293a0;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s;\" style-hover=\"border-color:rgba(255,122,24,0.55);color:#ff9a3d;background:rgba(255,122,24,0.05)\">+ Agregar hábito<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ showWaterRestore }}\" hint-placeholder-val=\"{{ false }}\">\n        <button onclick=\"{{ onRestoreWater }}\" style=\"width:100%;margin-top:10px;padding:13px;border-radius:15px;border:1.5px dashed rgba(127,230,255,0.35);background:rgba(43,134,255,0.06);color:#7fe6ff;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s;\" style-hover=\"background:rgba(43,134,255,0.12);border-color:rgba(127,230,255,0.6)\">💧 Volver a agregar el hábito de tomar agua<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:14px;background:linear-gradient(180deg, rgba(30,30,41,0.94), rgba(17,17,24,0.94));border:1px solid rgba(255,255,255,0.07);border-radius:20px;padding:17px;display:flex;flex-direction:column;gap:13px;\">\n      <div style=\"display:flex;align-items:center;gap:10px;\">\n        <span style=\"font-size:20px;\">📓<\u002Fspan>\n        <div style=\"font-size:14.5px;font-weight:800;color:#f4f4f7;\">¿Cómo te sentiste hoy?<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;\">\n        <sc-for list=\"{{ animos }}\" as=\"an\" hint-placeholder-count=\"5\">\n          <button onclick=\"{{ an.elegir }}\" aria-label=\"Estado de ánimo\" style=\"flex:1;height:50px;border-radius:14px;font-size:23px;cursor:pointer;font-family:inherit;background:{{ an.bg }};border:{{ an.borde }};filter:{{ an.filtro }};transition:all .22s;\" style-active=\"transform:scale(0.92)\">{{ an.emoji }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <textarea value=\"{{ notaHoy }}\" onchange=\"{{ onNota }}\" rows=\"2\" placeholder=\"¿Qué te dejó el día? Una línea alcanza.\" style=\"border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.32);padding:11px 13px;font-size:14px;line-height:1.55;font-family:inherit;color:#fff;outline:none;resize:none;\"><\u002Ftextarea>\n      <button onclick=\"{{ onGuardarNota }}\" style=\"padding:12px;border-radius:12px;border:none;background:{{ notaBtnBg }};color:{{ notaBtnFg }};font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .25s;\">{{ notaBtnTxt }}<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:14px;background:linear-gradient(180deg, rgba(24,24,33,0.88), rgba(15,15,21,0.88));border:1px solid rgba(255,255,255,0.07);border-radius:18px;padding:15px 16px;\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;\">\n        <div style=\"display:flex;align-items:center;gap:11px;min-width:0;\">\n          <span style=\"font-size:21px;flex:none;\">🔔<\u002Fspan>\n          <div style=\"min-width:0;\">\n            <div style=\"font-size:14px;font-weight:700;color:#eaeaef;\">Recordatorio diario<\u002Fdiv>\n            <div style=\"font-size:12px;color:#8a8a99;text-wrap:pretty;\">{{ reminderSub }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button onclick=\"{{ onToggleReminder }}\" aria-label=\"Activar recordatorio\" style=\"flex:none;width:50px;height:29px;border-radius:999px;border:none;cursor:pointer;padding:3px;display:flex;align-items:center;background:{{ reminderTrackBg }};transition:background 0.25s;\">\n          <span style=\"width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.45);transform:{{ reminderKnob }};transition:transform 0.22s cubic-bezier(0.2,0.8,0.2,1);\"><\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ reminderOn }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-top:13px;padding-top:13px;border-top:1px solid rgba(255,255,255,0.06);animation:fadeIn 0.25s ease both;\">\n          <span style=\"font-size:12.5px;color:#9293a0;font-weight:600;\">Avisarme a las<\u002Fspan>\n          <input type=\"time\" value=\"{{ reminderTime }}\" onchange=\"{{ onChangeReminderTime }}\" style=\"background:rgba(0,0,0,0.32);border:1px solid rgba(255,255,255,0.1);color:#fff;font-size:14px;font-family:inherit;border-radius:10px;padding:7px 10px;outline:none;color-scheme:dark;\">\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:14px;background:linear-gradient(180deg, rgba(24,24,33,0.88), rgba(15,15,21,0.88));border:1px solid rgba(255,255,255,0.07);border-radius:18px;padding:15px 16px;\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;\">\n        <div style=\"display:flex;align-items:center;gap:11px;min-width:0;\">\n          <span style=\"font-size:21px;flex:none;\">⏸️<\u002Fspan>\n          <div style=\"min-width:0;\">\n            <div style=\"font-size:14px;font-weight:700;color:#eaeaef;\">Modo pausa<\u002Fdiv>\n            <div style=\"font-size:12px;color:#8 -direction:column;align-items:center;gap:6px;\">\n                <span style=\"font-size:9.5px;font-weight:800;color:#6f7079;font-variant-numeric:tabular-nums;\">{{ db.pctTxt }}<\u002Fspan>\n                <div style=\"height:74px;width:100%;display:flex;align-items:flex-end;justify-content:center;\">\n                  <div style=\"width:100%;height:{{ db.h }};border-radius:5px 5px 3px 3px;background:{{ db.bg }};transition:height .5s ease;\"><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-size:10.5px;font-weight:800;color:#8a8a99;\">{{ db.dia }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n            <span style=\"font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(134,226,154,0.1);border:1px solid rgba(134,226,154,0.24);color:#9ff0b5;\">Día fuerte: {{ rev.mejorDiaTxt }}<\u002Fspan>\n            <span style=\"font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(255,128,128,0.09);border:1px solid rgba(255,128,128,0.22);color:#ff9a9a;\">Día flojo: {{ rev.peorDiaTxt }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ rev.sinDow }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border-radius:14px;padding:15px;background:rgba(255,255,255,0.03);border:1px dashed rgba(255,255,255,0.12);font-size:12.5px;line-height:1.6;color:#8a8a99;text-wrap:pretty;\">Todavía no hay diferencia entre tus días. Después de un par de semanas marcando hábitos vas a ver acá cuál es tu día fuerte y cuál el más flojo.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"border-radius:20px;padding:18px;background:linear-gradient(180deg, rgba(30,30,41,0.94), rgba(17,17,24,0.94));border:1px solid rgba(255,255,255,0.07);display:flex;flex-direction:column;gap:13px;\">\n        <div style=\"display:flex;flex-direction:column;gap:3px;\">\n          <div style=\"font-size:15px;font-weight:800;color:#f4f4f7;\">Ánimo y hábitos<\u002Fdiv>\n          <div style=\"font-size:11.5px;font-weight:600;color:#8a8a99;line-height:1.5;text-wrap:pretty;\">Cuánto cambia tu ánimo según hagas o no cada cosa. Usa todo tu historial, no solo esta semana.<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ rev.hayCorrel }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:12px;\">\n            <sc-for list=\"{{ rev.correl }}\" as=\"co\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                <div style=\"display:flex;align-items:center;gap:9px;\">\n                  <span style=\"font-size:16px;flex:none;line-height:1;\">{{ co.emoji }}<\u002Fspan>\n                  <span style=\"flex:1;min-width:0;font-size:12.5px;font-weight:700;color:#e2e3ea;text-wrap:pretty;\">{{ co.nombre }}<\u002Fspan>\n                  <span style=\"flex:none;font-size:14px;font-weight:900;color:{{ co.difColor }};font-variant-numeric:tabular-nums;\">{{ co.difTxt }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:{{ co.lado }};align-items:center;gap:8px;\">\n                  <div style=\"flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,0.05);overflow:hidden;min-width:0;\">\n                    <div style=\"width:{{ co.barW }};height:100%;border-radius:4px;background:{{ co.barBg }};transition:width .5s ease;\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:10.5px;font-weight:700;color:#6f7079;\">{{ co.detalle }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ rev.sinCorrel }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border-radius:14px;padding:15px;background:rgba(255,255,255,0.03);border:1px dashed rgba(255,255,255,0.12);font-size:12.5px;line-height:1.6;color:#8a8a99;text-wrap:pretty;\">Todavía no hay suficientes días con ánimo registrado. Marcá tu ánimo en la pestaña <strong style=\"color:#ffb24d;font-weight:800;\">Hoy<\u002Fstrong> durante unos días y acá vas a ver qué hábito te levanta y cuál no.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ rev.hayAcciones }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"border-radius:20px;padding:18px;background:linear-gradient(180deg, rgba(24,30,26,0.94), rgba(16,19,17,0.94));border:1px solid rgba(134,226,154,0.2);display:flex;flex-direction:column;gap:13px;\">\n        <div style=\"font-size:15px;font-weight:800;color:#9ff0b5;\">Para la semana que viene<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px;\">\n          <sc-for list=\"{{ rev.acciones }}\" as=\"ac\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:11px;align-items:flex-start;\">\n              <span style=\"font-size:17px;flex:none;line-height:1.3;\">{{ ac.icono }}<\u002Fspan>\n              <div style=\"flex:1;min-width:0;font-size:13px;line-height:1.55;color:#d6d7df;text-wrap:pretty;\">{{ ac.texto }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <p style=\"margin:4px 0 0;text-align:center;font-size:12px;color:#5a5b66;font-weight:500;line-height:1.6;\">La revisión se calcula sola con lo que ya registrás.<br>Cuanto más marcás tu ánimo, más fina se pone.<\u002Fp>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ imp.abierto }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:fixed;inset:0;z-index:75;background:rgba(6,6,10,0.74);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;padding:16px;overflow:auto;\">\n        <div style=\"width:100%;max-width:420px;border-radius:22px;padding:20px;background:linear-gradient(180deg, rgba(34,34,46,0.99), rgba(19,19,26,0.99));border:1px solid rgba(255,255,255,0.12);box-shadow:0 20px 60px rgba(0,0,0,0.6);display:flex;flex-direction:column;gap:13px;\">\n          <div>\n            <div style=\"font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#ffb24d;\">Importar datos<\u002Fdiv>\n            <div style=\"font-size:15.5px;font-weight:900;color:#f4f4f7;margin-top:5px;word-break:break-word;\">{{ imp.nombre }}<\u002Fdiv>\n            <div style=\"font-size:11.5px;font-weight:700;color:#8a8a99;margin-top:4px;\">{{ imp.fecha }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;padding:13px;border-radius:14px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.08);\">\n            <sc-for list=\"{{ imp.resumen }}\" as=\"rr\" hint-placeholder-count=\"4\">\n              <div style=\"font-size:12.5px;font-weight:700;color:#d6d7df;text-wrap:pretty;\">· {{ rr }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;font-weight:600;color:#8a8a99;line-height:1.5;text-wrap:pretty;\">Combinar suma lo del archivo a lo que ya tenés y no borra nada. Reemplazar pisa todo con el archivo.<\u002Fdiv>\n          <button onclick=\"{{ imp.combinar }}\" style=\"padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#ffb24d,#ff6a13);color:#1a1206;font-size:13.5px;font-weight:900;cursor:pointer;font-family:inherit;\">Combinar con lo que tengo<\u002Fbutton>\n          <div style=\"display:flex;gap:9px;\">\n            <button onclick=\"{{ imp.cancelar }}\" style=\"flex:none;padding:13px 16px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);color:#c4c5cf;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;\">Cancelar<\u002Fbutton>\n            <button onclick=\"{{ imp.reemplazar }}\" style=\"flex:1;padding:13px;border-radius:14px;background:rgba(255,93,118,0.12);border:1px solid rgba(255,93,118,0.3);color:#ff9a9a;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;\">Reemplazar todo<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ est.matAbierto }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:fixed;inset:0;z-index:70;background:rgba(6,6,10,0.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;padding:16px;overflow:auto;\">\n        <div style=\"width:100%;max-width:420px;border-radius:22px;padding:20px;background:linear-gradient(180deg, rgba(34,34,46,0.99), rgba(19,19,26,0.99));border:1px solid rgba(255,255,255,0.12);box-shadow:0 20px 60px rgba(0,0,0,0.6);display:flex;flex-direction:column;gap:12px;\">\n          <div style=\"font-size:16px;font-weight:900;color:#f4f4f7;\">Nueva materia<\u002Fdiv>\n          <input value=\"{{ est.matNombre }}\" onchange=\"{{ est.onMatNombre }}\" placeholder=\"Matemática\" maxlength=\"40\" style=\"width:100%;box-sizing:border-box;padding:14px;border-radius:14px;background:rgba(0,0,0,0.32);border:1px solid rgba(255,255,255,0.12);color:#f4f4f7;font-size:15px;font-weight:700;font-family:inherit;outline:none;\">\n          <div style=\"display:flex;flex-direction:column;gap:7px;\">\n            <label style=\"font-size:11px;font-weight:800;letter-spacing:.06em;color:#a9aab4;\">Año<\u002Flabel>\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap;\">\n              <sc-for list=\"{{ est.matAnioOpts }}\" as=\"ma\" hint-placeholder-count=\"6\">\n                <button onclick=\"{{ ma.ir }}\" style=\"flex:1;min-width:40px;padding:10px 6px;border-radius:12px;background:{{ ma.bg }};border:{{ ma.borde }};color:{{ ma.color }};font-size:12px;font-weight:900;cursor:pointer;font-family:inherit;font-variant-numeric:tabular-nums;\">{{ ma.label }}<\ 5 },\n  { id: 'foco_25', icono: '🧭', nombre: 'Profundidad', desc: '25 sesiones de foco', cond: m => m.foco >= 25 },\n  { id: 'diario_3', icono: '📓', nombre: 'Por escrito', desc: '3 reflexiones guardadas', cond: m => m.diario >= 3 },\n  { id: 'diario_14', icono: '🕊️', nombre: 'Ritmo interior', desc: '14 reflexiones guardadas', cond: m => m.diario >= 14 }\n];\nconst WP_META = [\n  { name: 'Aurora',    sw: 'linear-gradient(135deg,#16324f,#2bd1c4 58%,#7b4dff)' },\n  { name: 'Plasma',    sw: 'linear-gradient(135deg,#ff5d76,#ffb24d 50%,#22c8ff)' },\n  { name: 'Metaballs', sw: 'linear-gradient(135deg,#0a1228,#22c8ff 58%,#ff4dd2)' },\n  { name: 'Túnel',     sw: 'linear-gradient(135deg,#081a2e,#2b6fff 55%,#7fe6ff)' },\n  { name: 'Ondas',     sw: 'linear-gradient(135deg,#04060f,#2b86ff 60%,#7fe6ff)' },\n  { name: 'Noche',     sw: 'linear-gradient(135deg,#1b1140,#d12b8f 55%,#3a6bff)' }\n];\nconst WALLPAPER_FS = `\nprecision highp float;\nuniform float uTime;\nuniform vec2 uRes;\nuniform vec2 uMouse;\nuniform int uMode;\nuniform float uTOD;\nuniform vec2 uRip[8];\nuniform float uRipT[8];\n\nfloat hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }\nfloat noise(vec2 p){\n  vec2 i=floor(p), f=fract(p);\n  vec2 u=f*f*(3.0-2.0*f);\n  return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),u.x),\n             mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),u.x),u.y);\n}\nfloat fbm(vec2 p){\n  float v=0.0, a=0.5;\n  for(int i=0;i<4;i++){ v+=a*noise(p); p=p*2.02; a*=0.5; }\n  return v;\n}\nvec3 hue(float h){ return 0.5+0.5*cos(6.28318*(h+vec3(0.0,0.33,0.67))); }\n\n// ---- night-scene helpers ----\nfloat nHash21(vec2 p){ p=fract(p*vec2(123.34,345.45)); p+=dot(p,p+34.345); return fract(p.x*p.y); }\nvec2 nHash22(vec2 p){ vec3 a=fract(vec3(p.xyx)*vec3(123.34,234.34,345.65)); a+=dot(a,a+34.45); return fract(vec2(a.x*a.y,a.y*a.z)); }\nfloat nFbm(vec2 p){ float v=0.0,a=0.5; mat2 m=mat2(1.6,1.2,-1.2,1.6); for(int i=0;i<3;i++){ v+=a*noise(p); p=m*p; a*=0.5; } return v; }\nfloat nRidged(vec2 p){ float v=0.0,a=0.55; for(int i=0;i<3;i++){ float n=noise(p); n=1.0-abs(2.0*n-1.0); v+=a*n*n; p=p*2.0+1.3; a*=0.5; } return v; }\n// one star per grid cell, anti-aliased, with twinkle and brightness distribution\nfloat starField(vec2 uv, float density, float size, float tw, float seed){\n  vec2 g=uv*density; vec2 id=floor(g); vec2 f=fract(g)-0.5;\n  float h=nHash21(id+seed);\n  if(h<0.5) return 0.0;\n  vec2 off=(nHash22(id+seed)-0.5)*0.74;\n  float bri=pow(nHash21(id+seed+9.13),4.0);   // distribución de brillo\n  float szv=size*(0.45+1.7*bri);              // estrellas brillantes = más grandes\n  float d=length(f-off);\n  float ph=nHash21(id+seed+3.7)*6.2831;        // fase de parpadeo por estrella\n  float spd=0.5+2.0*nHash21(id+seed+5.1);      // velocidad de parpadeo por estrella\n  float twk=mix(1.0,0.4+0.6*sin(tw*spd*6.2831+ph),0.9);\n  return smoothstep(szv,0.0,d)*bri*twk;\n}\n// meteor: bright head + tapering tail along -dir (all in aspect-corrected space)\nfloat nMeteor(vec2 pa, vec2 head, vec2 dir, float len, float width){\n  vec2 rel=pa-head;\n  float al=dot(rel,dir);\n  float pe=length(rel-dir*al);\n  float along=smoothstep(0.0,-len,al)*exp(al*2.0);\n  float core=exp(-pe/width);\n  float headG=exp(-length(rel)*46.0);\n  return along*core + headG*1.7;\n}\n\nfloat ripples(){\n  float s=0.0;\n  for(int i=0;i<8;i++){\n    float st=uRipT[i];\n    if(st<-1.0) continue;\n    float age=uTime-st;\n    if(age<0.0 || age>2.2) continue;\n    float d=distance(gl_FragCoord.xy, uRip[i]);\n    float rad=age*uRes.y*0.6;\n    float ring=exp(-pow((d-rad)/(uRes.y*0.05),2.0));\n    s+=ring*exp(-age*1.6);\n  }\n  return s;\n}\n\n// ============================================================\n//  Noche cinematográfica — sky dome, aurora, reflejo, vida\n// ============================================================\nvec3 todSky(float y, float tod){\n  // tod: 0 = crepúsculo (horizonte cálido y brillante) · 1 = noche profunda\n  vec3 zenithT=vec3(0.045,0.035,0.135), upperT=vec3(0.11,0.055,0.27), midT=vec3(0.44,0.11,0.44), horT=vec3(0.99,0.42,0.46);\n  vec3 zenithN=vec3(0.008,0.006,0.034), upperN=vec3(0.028,0.018,0.105), midN=vec3(0.15,0.03,0.26), horN=vec3(0.42,0.10,0.40);\n  vec3 zen=mix(zenithT,zenithN,tod), up=mix(upperT,upperN,tod), mid=mix(midT,midN,tod), hor=mix(horT,horN,tod);\n  vec3 c=mix(hor,mid,smoothstep(0.0,0.34,y));\n  c=mix(c,up,smoothstep(0.30,0.66,y));\n  c=mix(c,zen,smoothstep(0.62,1.0,y));\n  return c;\n}\n\n// Cortinas de aurora boreal (verde→magenta): franjas verticales que fluyen\nvec3 aurora(vec2 p, vec2 par, float t){\n  vec3 a=vec3(0.0);\n  float px=p.x+par.x*0.04;\n  float zone=smoothstep(0.28,0.44,p.y)*smoothstep(0.92,0.56,p.y);  // banda de cielo sobre las cumbres\n  for(int i=0;i<3;i++){\n    float fi=float(i);\n    float baseY=0.47+0.10*fi;\n    // ondulación de la cortina (varias frecuencias = forma orgánica y serpenteante)\n    float wave=0.075*sin(px*2.1+t*0.30+fi*1.7)\n              +0.040*sin(px*4.6-t*0.46+fi*2.0)\n              +0.022*sin(px*9.5+t*0.66+fi*0.8)\n              +0.013*sin(px*17.0-t*0.9+fi*3.1);\n    float yy=p.y-baseY-wave;\n    float thick=0.072+0.022*sin(px*3.0-t*0.2+fi);                  // grosor variable\n    float band=exp(-pow(yy/thick,2.0));                            // cortina suave\n    // rayos verticales que descienden (animados) con remolino de ruido\n    float rayPhase=px*54.0 + nFbm(vec2(px*4.2, t*0.16+fi*3.0))*11.0 + p.y*6.0 - t*0.6;\n    float rays=pow(0.5+0.5*sin(rayPhase),1.5);\n    float gate=smoothstep(0.42,0.86,nFbm(vec2(px*1.7+fi*7.0-t*0.05,fi*3.0)));  // huecos entre cortinas\n    float breath=0.5+0.5*sin(t*0.4+fi*2.1);\n    float intensity=band*(0.35+0.65*rays)*gate*(0.45+0.55*breath);\n    // gradiente vertical de color: base verde-esmeralda → magenta → violeta en la cresta\n    vec3 lo=mix(vec3(0.05,0.85,0.45), vec3(0.18,1.0,0.62), 0.5+0.5*sin(t*0.3+fi));\n    vec3 hi=mix(vec3(0.78,0.20,0.95), vec3(0.45,0.30,1.0), smoothstep(0.0,0.16,yy));\n    vec3 colA=mix(lo,hi,smoothstep(-0.07,0.13,yy));\n    a+=colA*intensity;\n    // resplandor base difuso bajo cada cortina (la luz que tiñe el cielo)\n    a+=lo*0.12*exp(-pow((yy+0.05)/0.16,2.0))*gate*(0.4+0.6*breath);\n  }\n  return a*zone;\n}\n\n// Todo lo que está sobre el agua (lo que se refleja): cielo, vía láctea,\n// estrellas, aurora, nubes, orbe, montañas con parallax y la vida en la escena\nvec3 nightAbove(vec2 p, vec2 par, float tod){\n  float AR=uRes.x/uRes.y;\n  float t=uTime;\n  vec2 pa=vec2(p.x*AR,p.y);\n  vec2 orb=vec2(0.34,0.72)+par*0.06;\n  vec2 orbA=vec2(orb.x*AR,orb.y);\n\n  vec3 col=todSky(p.y,tod);\n  col+=vec3(0.22,0.06,0.11)*exp(-abs(p.y-0.285)*8.0)*0.7*(1.0-tod*0.5);\n\n  // ---- Vía Láctea protagonista: banda + núcleo galáctico denso ----\n  float mwA=-0.62; mat2 mwR=mat2(cos(mwA),-sin(mwA),sin(mwA),cos(mwA));\n  vec2 mwUV=mwR*(pa-vec2(0.52*AR,0.66)+vec2(par.x*0.02,0.0));\n  float mwBand=exp(-pow(mwUV.y/0.17,2.0));\n  float mwTex=nFbm(mwUV*vec2(2.2,5.5)+10.0);\n  float mwDust=nFbm(mwUV*vec2(3.4,9.0)+30.0);\n  float mw=mwBand*smoothstep(0.30,0.95,mwTex)*smoothstep(0.70,0.18,mwDust);\n  col+=mix(vec3(0.26,0.22,0.42),vec3(0.62,0.52,0.78),mwTex)*mw*0.6*smoothstep(0.18,0.5,p.y);\n  float coreD=length((mwUV-vec2(-0.02,0.0))*vec2(1.0,1.9));\n  float coreMask=smoothstep(0.25,0.85,mwTex)*smoothstep(0.18,0.5,p.y);\n  col+=mix(vec3(1.0,0.88,0.62),vec3(0.80,0.55,0.95),0.4)*exp(-coreD*3.6)*1.15*coreMask;  // halo dorado denso\n  col+=vec3(1.0,0.95,0.82)*exp(-coreD*8.0)*0.85*coreMask;                                 // núcleo brillante\n  col+=vec3(0.55,0.42,0.78)*exp(-coreD*1.3)*0.34*smoothstep(0.18,0.5,p.y);                 // resplandor amplio\n  // nubes de polvo oscuras cortando la banda galáctica\n  float dustLane=nFbm(mwUV*vec2(4.6,11.0)+50.0);\n  col*=1.0-0.42*mwBand*smoothstep(0.52,0.86,dustLane)*smoothstep(0.18,0.5,p.y);\n\n  float neb=nFbm(vec2(p.x*1.5-t*0.008,p.y*1.5)*1.2);\n  col+=vec3(0.42,0.05,0.42)*smoothstep(0.64,1.12,neb)*0.16*smoothstep(0.1
