0)*0.7*pulse;          // núcleo brillante difuminado\n  if(od<R*1.6){\n    float z=sqrt(max(R*R-od*od,0.0));\n    vec3 nrm=vec3(oRel/R,z/R);\n    vec2 suv=vec2(atan(nrm.x,nrm.z)*0.6,nrm.y*1.2);\n    float turb=nFbm(suv*3.0+vec2(t*0.18,t*0.06))+0.5*nFbm(suv*6.2-vec2(t*0.12,0.03));\n    turb=clamp(turb*0.5,0.0,1.0);\n    float fres=pow(1.0-clamp(z/R,0.0,1.0),1.6);\n    vec3 body=mix(vec3(0.09,0.34,0.96),vec3(0.58,0.86,1.0),turb);\n    body+=vec3(0.55,0.82,1.0)*fres*0.9;\n    body+=vec3(1.0,1.0,1.0)*exp(-od*62.0)*0.95;\n    float disc=smoothstep(R*1.05,R*0.7,od);\n    col=mix(col,body*1.45,disc);\n  }\n  vec2 fdir=vec2(0.5*AR,0.5)-orbA;\n  for(int gi=1;gi<=3;gi++){\n    vec2 gp=orbA+fdir*(float(gi)*0.45);\n    col+=vec3(0.25,0.45,0.85)*exp(-distance(pa,gp)*26.0)*0.10;\n  }\n\n  // ---- meteoros ----\n  float m1=mod(t,6.0);\n  if(m1<1.1){ float pr=m1/1.1; vec2 dir=normalize(vec2(1.0,-0.5));\n    vec2 hd=vec2((0.06)*AR,0.96)+dir*pr*1.15;\n    col+=vec3(1.0,0.97,0.9)*nMeteor(pa,hd,dir,0.34,0.006)*smoothstep(0.0,0.12,pr)*smoothstep(1.0,0.72,pr)*1.7; }\n  float m2c=mod(t+2.6,8.5);\n  if(m2c<0.9){ float pr=m2c/0.9; vec2 dir=normalize(vec2(-0.92,-0.42));\n    vec2 hd=vec2((0.95)*AR,0.90)+dir*pr*1.2;\n    col+=vec3(0.92,0.96,1.0)*nMeteor(pa,hd,dir,0.28,0.0055)*smoothstep(0.0,0.12,pr)*smoothstep(1.0,0.7,pr)*1.5; }\n\n  // ---- montañas en capas con parallax real ----\n  vec3 sky=todSky(p.y,tod);\n  float pkA=nRidged(vec2((p.x+par.x*0.010)*2.0+12.0,1.0));\n  float rA=0.375+0.085*pkA+0.02*nFbm(vec2(p.x*6.0,3.0));\n  float belowA=rA-p.y; float inA=step(0.0,belowA);\n  // iluminación direccional coherente desde el orbe (normal por pendiente de cresta)\n  float eA=0.0045;\n  float rAl=0.375+0.085*nRidged(vec2((p.x-eA+par.x*0.010)*2.0+12.0,1.0))+0.02*nFbm(vec2((p.x-eA)*6.0,3.0));\n  float rAr=0.375+0.085*nRidged(vec2((p.x+eA+par.x*0.010)*2.0+12.0,1.0))+0.02*nFbm(vec2((p.x+eA)*6.0,3.0));\n  vec3 nA=normalize(vec3(-(rAr-rAl)/(2.0*eA),1.0,2.4));\n  vec3 LA=normalize(vec3(orbA.x-p.x*AR, orbA.y-rA, 0.55));\n  float diffA=clamp(dot(nA,LA),0.0,1.0);\n  float litA=exp(-distance(vec2(p.x*AR,rA),orbA)*1.5)*0.5+diffA*0.85;\n  vec3 baseA=mix(vec3(0.30,0.21,0.50),vec3(0.13,0.09,0.30),smoothstep(0.0,0.20,belowA));\n  baseA=mix(baseA,vec3(0.52,0.40,0.72),clamp(litA,0.0,1.0)*0.7);\n  float snowA=smoothstep(0.075,0.0,belowA)*smoothstep(0.45,0.72,nFbm(vec2(p.x*14.0+1.0,2.0)));\n  baseA=mix(baseA,vec3(0.82,0.80,0.97),snowA*(0.35+0.5*diffA));\n  baseA+=vec3(0.05,0.04,0.07)*(nFbm(vec2(p.x*42.0,p.y*64.0))-0.5)*inA;\n  baseA=mix(sky,baseA,smoothstep(0.0,0.12,belowA));\n  col=mix(col,baseA,inA*0.62);\n  col+=vec3(0.95,0.66,1.0)*smoothstep(0.010,0.0,abs(belowA))*(0.14+0.5*clamp(litA,0.0,1.0));\n  float pkB=nRidged(vec2((p.x+par.x*0.022)*2.8+5.0,7.0));\n  float rB=0.300+0.085*pkB+0.02*sin(p.x*7.0+1.0);\n  float belowB=rB-p.y; float inB=step(0.0,belowB);\n  float eB=0.0045;\n  float rBl=0.300+0.085*nRidged(vec2((p.x-eB+par.x*0.022)*2.8+5.0,7.0))+0.02*sin((p.x-eB)*7.0+1.0);\n  float rBr=0.300+0.085*nRidged(vec2((p.x+eB+par.x*0.022)*2.8+5.0,7.0))+0.02*sin((p.x+eB)*7.0+1.0);\n  vec3 nB=normalize(vec3(-(rBr-rBl)/(2.0*eB),1.0,2.2));\n  vec3 LB=normalize(vec3(orbA.x-p.x*AR, orbA.y-rB, 0.5));\n  float diffB=clamp(dot(nB,LB),0.0,1.0);\n  float litB=exp(-abs(p.x*AR-orbA.x)*0.8)*exp(-abs(rB-orbA.y)*1.4)*0.5+diffB*0.6;\n  vec3 baseB=mix(vec3(0.12,0.07,0.30),vec3(0.05,0.03,0.18),smoothstep(0.0,0.16,belowB));\n  baseB+=vec3(0.20,0.13,0.32)*clamp(litB,0.0,1.0)*0.8;\n  baseB+=vec3(0.03,0.02,0.05)*(nFbm(vec2(p.x*72.0,p.y*82.0))-0.5)*inB;\n  baseB=mix(sky,baseB,smoothstep(0.0,0.07,belowB));\n  col=mix(col,baseB,inB*0.92);\n  col+=vec3(0.62,0.36,0.78)*smoothstep(0.007,0.0,abs(belowB))*0.22;\n  float pine=0.022*nFbm(vec2((p.x+par.x*0.04)*55.0,9.0))+0.014*nFbm(vec2(p.x*120.0,3.0));\n  float rC=0.235+0.07*nRidged(vec2((p.x+par.x*0.04)*3.4+40.0,3.0))+pine;\n  float belowC=rC-p.y; float inC=step(0.0,belowC);\n  vec3 baseC=vec3(0.016,0.011,0.055);\n  baseC+=vec3(0.045,0.03,0.085)*(nFbm(vec2(p.x*165.0,p.y*120.0))-0.5)*0.85;\n  baseC+=vec3(0.05,0.04,0.11)*smoothstep(0.6,0.92,nFbm(vec2(p.x*95.0,p.y*60.0)))*0.5;\n  col=mix(col,baseC,inC*0.98);\n  col+=vec3(0.45,0.2,0.6)*smoothstep(0.006,0.0,abs(belowC))*0.22;\n\n  // ---- VIDA: luciérnagas entre los árboles ----\n  for(int fl=0;fl<7;fl++){\n    float fid=float(fl); vec2 sd=vec2(fid*12.3,7.0);\n    float fx=0.16+0.68*nHash21(sd)+0.045*sin(t*0.5+fid*1.7);\n    float fy=0.215+0.085*nHash21(sd+3.1)+0.028*sin(t*0.7+fid*2.3);\n    float blink=smoothstep(0.25,1.0,sin(t*1.5+fid*2.0)*0.5+0.5);\n    float fd=distance(pa,vec2(fx*AR,fy));\n    col+=vec3(0.8,1.0,0.35)*exp(-fd*240.0)*blink*1.3;\n    col+=vec3(0.5,0.8,0.2)*exp(-fd*70.0)*blink*0.22;\n  }\n  return col;\n}\n\n// Composición final: parte superior + reflejo en el lago\nvec3 nightFinal(vec2 fc){\n  float t=uTime, tod=uTOD;\n  vec2 p=fc/uRes;\n  vec2 par=(uMouse/uRes-0.5);\n  float water=0.200;\n  vec3 col;\n  if(p.y>=water){\n    col=nightAbove(p,par,tod);\n  } else {\n    // ============================================================\n    //  LAGO FOTORREALISTA — espejo físico de la escena + Fresnel,\n    //  olas con perspectiva, sendero lunar, destellos y orilla\n    // ============================================================\n    float depth=water-p.y;                       // 0 en la orilla → 'water' en el borde inferior\n    float fade=clamp(depth/water,0.0,1.0);       // 0 lejos (orilla) → 1 cerca (espectador)\n    float persp=mix(0.22,1.0,fade);              // olas más anchas y altas hacia el espectador\n\n    // ---- campo de ondas viajeras multi-octava (capilares + gravedad) ----\n    float w1=sin(p.x*36.0 + t*0.85 + sin(p.y*26.0+t*0.4)*1.1);\n    float w2=sin(p.x*58.0 - t*1.20 + p.y*22.0);\n    float w3=sin(p.x*94.0 + t*1.70 + p.y*46.0);\n    float turb=(nFbm(vec2(p.x*8.5 - t*0.16, p.y*40.0))-0.5);\n    float micro=(nFbm(vec2(p.x*64.0 + t*0.55, p.y*150.0))-0.5);\n    float wob=w1*0.42 + w2*0.26 + w3*0.15 + turb*1.5;\n    float slope=cos(p.x*36.0 + t*0.85)*36.0*0.42\n               +cos(p.x*58.0 - t*1.20)*58.0*0.26\n               +cos(p.x*94.0 + t*1.70)*94.0*0.15;\n\n    // amplitud de distorsión: crece con la profundidad (más cerca, olas más marcadas)\n    float amp=(0.0018 + depth*0.078)*persp;\n    // ---- reflexión FÍSICA: espejo respecto a la línea de agua + distorsión por olas ----\n    float mY=(2.0*water - p.y) + wob*amp + micro*0.004*persp;   // altura espejada\n    float mX=p.x + wob*amp*0.55 + micro*0.006*persp;\n    vec3 refl=nightAbove(vec2(clamp(mX,-0.05,1.05), clamp(mY,water,1.7)), par*0.86, tod);\n\n    // el agua absorbe y enfría el reflejo; se oscurece hacia el espectador\n    refl*=vec3(0.60,0.69,0.92);\n    refl*=1.0-0.42*fade;\n\n    // cuerpo de agua profundo (color propio del lago)\n    vec3 body=mix(vec3(0.030,0.046,0.115), vec3(0.010,0.018,0.058), fade);\n    body+=vec3(0.015,0.02,0.05)*turb;            // variación tonal sutil\n\n    // Fresnel: incidencia rasante en la orilla → casi todo reflejo;\n    //          mirada vertical cerca del espectador → domina el color del agua\n    float fres=mix(0.16,1.0,pow(1.0-fade,3.0));\n    vec3 colw=mix(body,refl,fres);\n\n    // rompimiento de cresta: caras de ola muy inclinadas dispersan el reflejo\n    float crest=smoothstep(15.0,46.0,abs(slope)*(0.4+fade*5.0));\n    colw=mix(colw, body*1.35, crest*0.5);\n\n    // ---- sendero lunar: columna de luz del orbe centelleando sobre el agua ----\n    float orbX=0.34+par.x*0.06;\n    float cd=(p.x-orbX)/(0.016+depth*0.9);\n    float column=exp(-cd*cd);\n    float glint=pow(0.5+0.5*sin(p.x*36.0 + t*0.85 + wob*3.2),24.0)\n              + pow(0.5+0.5*sin(p.x*58.0 - t*1.20 + micro*4.0),34.0);\n    colw+=vec3(0.55,0.74,1.0)*column*(0.32+glint*1.25)*smoothstep(0.0,0.010,depth);\n\n    // ---- destellos dispersos (glitter) sobre las crestas lejanas ----\n    float spk=smoothstep(0.84,1.0, nFbm(vec2(p.x*115.0 + t*0.9, p.y*128.0 - t*0.55)));\n    colw+=vec3(0.70,0.82,1.0)*spk*(0.14+0.55*column)*(0.35+0.65*fade);\n\n    // ---- neblina/brillo en la orilla donde el agua toca la arboleda ----\n    colw+=vec3(0.30,0.22,0.44)*smoothstep(0.018,0.0,depth)*0.65;\n    colw+=vec3(0.10,0.13,0.22)*smoothstep(0.0,0.05,depth)*(1.0-fade)*0.5; // bruma rasante\n\n    // ---- ondas interactivas al tocar ----\n    colw+=vec3(0.5,0.7,1.0)*ripples()*0.45;\n\n    col=colw;\n  }\n  return col;\n}\n\nvoid main(){\n  vec2 uv=(gl_FragCoord.xy*2.0-uRes)/uRes.y;\n  vec2 ms=(uMouse*2.0-uRes)/uRes.y;\n  float t=uTime;\n  vec3 col=vec3(0.0);\n\n  if(uMode==0){\n    vec2 p=uv;\n    p.x+=0.25*ms.x;\n    float c=fbm(vec2(p.x*1.1+t*0.06, p.y*0.7+t*0.04));\n    c+=0.5*fbm(vec2(p.x*2.3-t*0.05, p.y*1.3));\n    float curtain=smoothstep(0.1,1.0,c)*(0.55+0.45*sin(p.x*3.0+t*0.6+c*4.0));\n    float hsh=0.45+0.18*c+0.12*ms.y+0.05*sin(t*0.15);\n    col=mix(vec3(0.02,0.03,0.06), hue(hsh), clamp(curtain,0.0,1.0));\n    float md=length(uv-ms);\n    col+=hue(0.07)*0.5*exp(-md*2.2);\n  } else if(uMode==1){\n    vec2 p=uv*1.5 + 0.4*ms;\n    float v=sin(p.x*2.0+t);\n    v+=sin((p.y+t*0.7)*2.0);\n    v+=sin((p.x+p.y+t)*1.5);\n    v+=sin(length(p-ms)*4.0 - t*1.5);\n    v*=0.25;\n    float h=0.55+0.4*v+0.1*sin(t*0.2);\n    col=0.5+0.5*cos(6.28318*(h+vec3(0.0,0.33,0.67)));\n    col*=0.55+0.45*v;\n    col=max(col,0.0);\n    float md=length(uv-ms);\n    col+=0.35*exp(-md*3.0)*hue(0.0);\n  } else if(uMode==2){\n    float field=0.0;\n    for(int i=0;i<5;i++){\n      float fi=float(i);\n      vec2 c=vec2(sin(t*0.5+fi*1.7)*1.3, cos(t*0.43+fi*2.3)*0.85);\n      field+=0.17/max(length(uv-c),0.08);\n    }\n    field+=0.34/max(length(uv-ms),0.06);\n    float iso=smoothstep(1.35,1.75,field);\n    col=hue(0.55+0.12*sin(t*0.2)+0.1*ms.x)*iso*0.9;\n    float edge=smoothstep(0.06,0.0, abs(field-1.5));\n    col+=hue(0.85)*edge*1.1;\n    col+=vec3(0.02,0.03,0.07);\n  } else if(uMode==3){\n    vec2 q=uv-0.35*ms;\n    float a=atan(q.y,q.x);\n    float r=length(q);\n    float u=0.32/r + t*0.5;\n    float rings=0.5+0.5*sin(u*10.0);\n    float spokes=0.5+0.5*sin(a*18.0 + t*0.5);\n    float grid=mix(rings, rings*spokes, 0.6);\n    col=hue(0.6+0.25*sin(u*0.7)+0.1*a)*grid*smoothstep(0.0,0.5,r);\n    col+=vec3(0.5,0.75,1.0)*exp(-r*3.5)*0.7;\n    col*=0.9;\n  } else if(uMode==4){\n    vec2 g=uv*7.0;\n    vec2 gi=fract(g)-0.5;\n    float dots=smoothstep(0.16,0.10,length(gi));\n    float cur=sin(length(uv-ms)*12.0 - t*4.0)*exp(-length(uv-ms)*2.0);\n    col=vec3(0.03,0.05,0.10);\n    col+=dots*vec3(0.10,0.18,0.34);\n    col+=vec3(0.25,0.55,0.95)*max(cur,0.0)*0.6;\n  } else {\n    // ====== Noche cinematográfica: reflejo, aurora, CA, viñeta, grano ======\n    {\n      vec2 fc=gl_FragCoord.xy;\n      vec2 uvc=(fc/uRes-0.5);\n      float rad=length(uvc);\n      // aberración cromática solo en los bordes (resample triple acotado)\n      float caAmt=(rad>0.52)?0.007*pow((rad-0.52)/0.19,1.6):0.0;\n      vec3 nc;\n      if(caAmt<0.0004){\n        nc=nightFinal(fc);\n      } else {\n        vec2 off=normalize(uvc+vec2(1e-5))*caAmt*uRes.y;\n        vec3 a=nightFinal(fc+off);\n        vec3 b=nightFinal(fc-off);\n        nc=vec3(a.r,(a.g+b.g)*0.5,b.b);\n      }\n      nc+=(nHash21(fc*1.37+vec2(fract(t)*97.1,fract(t*1.7)*53.3))-0.5)*0.045; // grano de película\n      nc*=mix(1.0,0.50,smoothstep(0.30,0.98,rad*1.8));                        // viñeta cinematográfica\n      nc=pow(clamp(nc,0.0,1.0),vec3(0.92));\n      gl_FragColor=vec4(nc,1.0);\n      return;\n    }\n    // ============ (legacy, inalcanzable) ============\n    float ar = uRes.x/uRes.y;\n    vec2 p = gl_FragCoord.xy/uRes;            // 0..1, y up\n    vec2 mn = uMouse/uRes;                     // mouse normalized\n    vec2 par = (mn-0.5);                       // parallax\n    vec2 pa = vec2(p.x*ar, p.y);               // aspect-corrected\n    vec2 orb = vec2(0.34,0.72) + par*0.05;     // light source (blue orb)\n    vec2 orbA = vec2(orb.x*ar, orb.y);\n\n    // ---- atmospheric sky gradient (physically-plausible night) ----\n    vec3 zenith  = vec3(0.015,0.01 n Foco › Estudio, plan completo en la pestaña Plan =================\n   No toca la lógica de la app: lee las materias y el tiempo de Foco (pomoMaterias, pomoSeg)\n   y guarda su propio estado en la clave PLAN_KEY. Las horas estudiadas salen de tus\n   pomodoros y de la carga manual de Foco. */\nvar PLAN_KEY = 'rastreador-habitos:plan-estudio';\nvar UI_KEY = 'rastreador-habitos:plan-estudio-ui';\nvar PALETTE = ['#6ea8fe','#ff9a5c','#86e29a','#c49bf2','#ffd24a','#7fe6ff','#ff79bf','#b4c46e','#e0a26b','#ff8a98'];\nvar TYPES = ['Parcial','Recuperatorio','Final','Entrega TP','Coloquio','Otro'];\nvar TYPE_K = {'Parcial':['k-par','P'],'Recuperatorio':['k-rec','R'],'Final':['k-fin','F'],'Entrega TP':['k-tp','TP'],'Coloquio':['k-par','C'],'Otro':['k-otro','•']};\nvar IMP = ['','Baja','Moderada','Media','Alta','Crítica'];\nvar DOW = ['dom','lun','mar','mié','jue','vie','sáb'];\nvar DOWL = ['L','M','M','J','V','S','D'];\nvar DOWN = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];\nvar MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];\nvar MESL = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];\nvar ST_LABEL = {ok:'En ritmo',ajustado:'Ajustado',riesgo:'En riesgo',listo:'Lista',hoy:'Es hoy',pasado:'Rendida',manual:'Manual'};\n\n/* Plan inicial vacío: tus evaluaciones llegan con tu respaldo o desde la nube */\nvar SEED = {\n  settings:{avail:[5,5,5,5,5,7,7],maxPerDay:3,mode:'adelantar',newManual:false,daysOff:[]},\n  evals:[]\n};\n\n/* ---------- utilidades ---------- */\nfunction pad(n){return String(n).padStart(2,'0')}\nfunction iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}\nfunction parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}\nfunction addD(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}\nfunction diff(a,b){var x=a.split('-').map(Number),y=b.split('-').map(Number);return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/864e5)}\nfunction today(){return iso(new Date())}\nfunction wdIdx(s){return (parse(s).getDay()+6)%7}\nfunction fmtD(s){var d=parse(s);return DOW[d.getDay()]+' '+d.getDate()+' '+MES[d.getMonth()]}\nfunction fmtShort(s){var d=parse(s);return d.getDate()+'/'+(d.getMonth()+1)}\nfunction clamp(v,a,b){return Math.min(b,Math.max(a,v))}\nfunction esc(s){return String(s).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]})}\nfunction uid(){return 'e'+Math.random().toString(36).slice(2,9)}\nfunction fmtH(h){var r=Math.round(h*10)/10;return (r%1===0?r.toFixed(0):r.toFixed(1)).replace('.',',')}\nfunction fmtHm(min){min=Math.round(min);var h=Math.floor(min/60),m=min%60;return h?(h+' h'+(m?' '+m:'')):m+' min'}\nfunction rel(n){if(n===0)return 'hoy';if(n===1)return 'mañana';if(n===-1)return 'ayer';if(n<0)return 'hace '+(-n)+' días';return 'en '+n+' días'}\nfunction hexA(hex,a){return hex+Math.round(clamp(a,0,1)*255).toString(16).padStart(2,'0')}\nfunction norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}\nfunction initials(s){return norm(s).split(' ').filter(function(w){return w.length>2}).map(function(w){return w[0]}).join('')}\nfunction isDate(v){return typeof v==='string'&&/^\\d{4}-\\d{2}-\\d{2}$/.test(v)}\n\n/* ---------- conexión con la app ---------- */\nfunction app(){var a=window.__fusInst;return a&&a.state?a:null}\nfunction W(){var a=app(),d=a&&a.state.pomoDur;return (d&&+d.foco>0)?+d.foco:50}\nfunction Rst(){var a=app(),d=a&&a.state.pomoDur;return (d&&+d.corto>=0)?+d.corto:10}\nfunction focoMaterias(){var a=app();return a&&Array.isArray(a.state.pomoMaterias)?a.state.pomoMaterias.slice():[]}\nfunction focoMateriaActual(){var a=app();return a?a.state.pomoMateria:''}\nfunction enFoco(m){var n=norm(m);return focoMaterias().some(function(x){return norm(x)===n})}\nfunction matchFoco(name){\n  var n=norm(name), list=focoMaterias(), ini=initials(name), hit=null;\n  list.forEach(function(x){if(!hit&&norm(x)===n)hit=x});\n  list.forEach(function(x){var nx=norm(x);if(!hit&&n.length>=3&&nx.length>=3&&(nx.indexOf(n)>=0||n.indexOf(nx)>=0))hit=x});\n  list.forEach(function(x){var nx=norm(x).replace(/ /g,'');if(!hit&&((ini.length>=2&&nx===ini)||(initials(x).length>=2&&initials(x)===n.replace(/ /g,''))))hit=x});\n  return hit;\n}\nfunction toast(msg){var a=app();if(a&&typeof a.showToast==='function'){try{a.showToast(msg);return}catch(e){}}}\nfunction elegirEnFoco(materia){\n  var a=app(); if(!a||typeof a.persistPomo!=='function') return;\n  var list=focoMaterias(), real=null;\n  list.forEach(function(x){if(norm(x)===norm(materia))real=x});\n  if(!real){real=materia;a.persistPomo({pomoMaterias:list.concat([materia]),pomoMateria:materia})}\n  else a.persistPomo({pomoMateria:real});\n  var cambia=a.state.tab!=='foco'||a.state.modoFoco!=='estudio';\n  if(cambia) a.setState({tab:'foco',modoFoco:'estudio'});\n  setTimeout(function(){var scr=document.querySelector('[data-screen-label=\"Foco\"]');if(scr&&scr.scrollIntoView)scr.scrollIntoView({behavior:'smooth',block:'start'})},cambia?120:0);\n  toast('🎯 '+real+' elegida en el timer');\n}\nfunction sumarAFoco(materia){\n  var a=app(); if(!a||typeof a.persistPomo!=='function') return;\n  if(!enFoco(materia)) a.persistPomo({pomoMaterias:focoMaterias().concat([materia])});\n}\n\n/* ---------- estado del plan ---------- */\nvar P=null, ui={view:'evals',calMonth:null,calSel:null,armed:{},pastOpen:false};\ntry{var u=JSON.parse(localStorage.getItem(UI_KEY)||'null');if(u&&['evals','plan','cal','ajustes'].indexOf(u.view)>=0)ui.view=u.view}catch(e){}\nfunction saveUi(){try{localStorage.setItem(UI_KEY,JSON.stringify({view:ui.view}))}catch(e){}}\nfunction normEval(x,i){\n  if(!x||typeof x!=='object'||!x.materia) return null;\n  var ov={};\n  if(x.ov&&typeof x.ov==='object') Object.keys(x.ov).forEach(function(k){if(isDate(k)&&isFinite(+x.ov[k]))ov[k]=clamp(+x.ov[k],0,16)});\n  var dias=null;\n  if(Array.isArray(x.dias)&&x.dias.length===7){var b=x.dias.map(Boolean),on=b.filter(Boolean).length;dias=(on===7||on===0)?null:b}\n  return {\n    id:String(x.id||uid()), materia:String(x.materia).slice(0,80), label:String(x.label||'').slice(0,60),\n    type:TYPES.indexOf(x.type)>=0?x.type:'Parcial', exam:isDate(x.exam)?x.exam:addD(today(),14),\n    imp:clamp(Math.round(+x.imp||3),1,5), hours:Math.max(0,+x.hours||0), base:Math.max(0,+x.base||0),\n    color:/^#[0-9a-f]{6}$/i.test(x.color)?x.color:PALETTE[(i||0)%PALETTE.length],\n    temas:Array.isArray(x.temas)?x.temas.map(function(t){return typeof t==='string'?{t:t,done:false}:t}).filter(function(t){return t&&t.t}).map(function(t){return {t:String(t.t).slice(0,120),done:!!t.done}}):[],\n    from:isDate(x.from)?x.from:'', to:isDate(x.to)?x.to:'', dias:dias,\n    manual:!!x.manual, wk:Array.isArray(x.wk)&&x.wk.length===7?x.wk.map(function(v){return clamp(+v||0,0,16)}):[0,0,0,0,0,0,0],\n    ov:ov, since:isDate(x.since)?x.since:today(), note:String(x.note||'').slice(0,200)\n  };\n}\nfunction normPlan(raw){\n  var p={v:1,evals:[],settings:{avail:[5,5,5,5,5,4,2],maxPerDay:3,mode:'adelantar',newManual:false,daysOff:[]},log:{},segSnap:null};\n  if(!raw||typeof raw!=='object') return p;\n  if(Array.isArray(raw.evals)) p.evals=raw.evals.map(normEval).filter(Boolean);\n  var r=raw.settings;\n  if(r&&typeof r==='object'){\n    if(Array.isArray(r.avail)&&r.avail.length===7) p.settings.avail=r.avail.map(function(v){return clamp(+v||0,0,16)});\n    if(+r.maxPerDay>0) p.settings.maxPerDay=clamp(Math.round(+r.maxPerDay),1,12);\n    if(r.mode==='parejo'||r.mode==='adelantar') p.settings.mode=r.mode;\n    p.settings.newManual=!!r.newManual;\n    if(Array.isArray(r.daysOff)) p.settings.daysOff=r.daysOff.filter(isDate).sort();\n  }\n  if(raw.log&&typeof raw.log==='object') Object.keys(raw.log).forEach(function(d){\n    if(!isDate(d)||!raw.log[d]||typeof raw.log[d]!=='object') return;\n    var o={}; Object.keys(raw.log[d]).forEach(function(m){var v=+raw.log[d][m];if(v>0)o[m]=v}); if(Object.keys(o).length) p.log[d]=o;\n  });\n  if(raw.segSnap&&typeof raw.segSnap==='object') p.segSnap=raw.segSnap;\n  return p;\n}\nfunction save(){try{localStorage.setItem(PLAN_KEY,JSON.stringify(P))}catch(e){}}\nfunction loadPlan(){\n  var raw=null; try{raw=JSON.parse(localStorage.getItem(PLAN_KEY)||'null')}catch(e){raw=null}\n  if(raw){P=normPlan(raw);return}\n  /* primera vez: tus evaluaciones actuales, vinculadas a tus materias de Foco cuando coinciden */\n  var t=today();\n  P=normPlan({settings:SEED.settings,evals:SEED.evals.map(function(e){var c=JSON.parse(JSON.stringify(e));var m=matchFoco(c.materia);if(m)c.materia=m;c.since=t;return c})});\n  save();\n}\n\n/* ---------- registro diario a partir de tu tiempo de Foco ---------- */\nvar ignoreUntil=0;\nfunction addLog(d,m,min){if(!P.log[d])P.log[d]={};P.log[d][m]=Math.round(((P.log[d][m]||0)+min)*10)/10;if(P.log[d][m]<=0)delete P.log[d][m];if(!Object.keys(P.log[d]).length)delete P.log[d]}\nfunction seedFromHist(a){\n  (a.state.pomoHist||[]).forEach(function(e){\n    var u=null; try{u=typeof a.inferUndo==='function'?a.inferUndo(e):e.undo}catch(_){u=e.undo}\n    if(u&&u.tipo==='foco'&&u.clave&&u.min>0&&isDate(u.dia)) addLog(u.dia,u.clave,u.min);\n  });\n}\nfunction syncLog(){\n  var a=app(); if(!a) return false;\n  var seg=a.state.pomoSeg||{};\n  if(!P.segSnap){P.segSnap=JSON.parse(JSON.stringify(seg));seedFromHist(a);save();return true}\n  if(Date.now()<ignoreUntil){P.segSnap=JSON.parse(JSON.stringify(seg));save();return false}\n  var t=today(), changed=false, keys={};\n  Object.keys(seg).forEach(function(k){keys[k]=1}); Object.keys(P.segSnap).forEach(function(k){keys[k]=1});\n  Object.keys(keys).forEach(function(k){\n    var dm=((+seg[k]||0)-(+P.segSnap[k]||0))/60;\n    if(Math.abs(dm)<0.5) return;\n    changed=true;\n    if(Math.abs(dm)>960) return; /* cambio enorme: import o reinicio de datos, no es estudio */\n    if(dm>0) addLog(t,k,dm);\n    else { var rest=-dm; Object.keys(P.log).sort().reverse().forEach(function(d){if(rest<=0||!P.log[d][k])return;var q=Math.min(rest,P.log[d][k]);addLog(d,k,-q);rest-=q}); }\n  });\n  if(changed){P.segSnap=JSON.parse(JSON.stringify(seg));save()}\n  return changed;\n}\n/* minutos de Foco que cuentan para cada evaluación: los de su materia, desde que la cargaste,\n   asignados a la evaluación más próxima de esa materia */\nfunction attribution(){\n  var res={}, t=today(), byMat={};\n  P.evals.forEach(function(e){res[e.id]={total:0,today:0};var k=norm(e.materia);(byMat[k]=byMat[k]||[]).push(e)});\n  Object.keys(byMat).forEach(function(k){byMat[k].sort(function(a,b){return a.exam<b.exam?-1:a.exam>b.exam?1:0})});\n  Object.keys(P.log).forEach(function(d){\n    Object.keys(P.log[d]).forEach(function(m){\n      var list=byMat[norm(m)]; if(!list) return;\n      var e=null; for(var i=0;i<list.length;i++){if(list[i].exam>=d&&d>=list[i].since){e=list[i];break}}\n      if(!e) return;\n      res[e.id].total+=P.log[d][m]; if(d===t) res[e.id].today+=P.log[d][m];\n    });\n  });\n  return res;\n}\n\n/* ---------- algoritmo de reparto ---------- */\nvar plan=null, attr={};\nfunction dayCap(d){var S=P.settings;if(S.daysOff.indexOf(d)>=0)return 0;return Math.round(S.avail[wdIdx(d)]*60/(W()+Rst()))}\nfunction CH(){return (W()+Rst())/60}\nfunction bH(b){return b*CH()}\nfunction hB(h){return h/CH()}\nfunction pomTxt(b){var r=Math.round(b*10)/10;return fmtH(r)+' pomodoro'+(Math.abs(r-1)<1e-9?'':'s')}\nfunction dayAllowed(e,d){return !e.dias||!!e.dias[wdIdx(d)]}\nfunction dn(e){return e.materia+(e.label?' · '+e.label:'')}\nfunction doneB(e){return hB(e.base)+((attr[e.id]&&attr[e.id].total)||0)/W()}\nfunction doneMin(e){return doneB(e)*W()}\nfunction periodCalc(e){\n  var t=today(), lastStudy=addD(e.exam,-1);\n  var from=e.from&&e.from>t?e.from:t;\n  var to=e.to&&e.to<lastStudy?e.to:lastStudy;\n  var remH=Math.max(0,e.hours-bH(doneB(e)));\n  var out={from:from,to:to,days:0,useful:0,capB:0,remH:remH,perDay:null};\n  if(to<from) return out;\n  out.days=diff(from,to)+1;\n  for(var i=0;i<out.days;i++){var d=addD(from,i);if(!dayAllowed(e,d))continue;var c=dayCap(d);if(c>0){out.useful++;out.capB+=c}}\n  out.perDay=out.useful?remH/out.useful:null;\n  return out;\n}\nfunction manualHours(e,d,i,f){\n  if(i<f.startIdx||i>f.endIdx) return 0;\n  if(Object.prototype.hasOwnProperty.call(e.ov,d)) return +e.ov[d]||0;\n  if(P.settings.daysOff.indexOf(d)>=0) return 0;\n  return +e.wk[wdIdx(d)]||0;\n}\nfunction best(cand,info,used,quota,i,k,ignoreCap){\n  var S=P.settings,b=null,bs=-1;\n  for(var x=0;x<cand.length;x++){\n    var s=cand[x],f=info[s.id]; if(f.rem<=0) continue;\n    var u=used[s.id]||0, eve=(f.endIdx===i);\n    if(S.mode==='parejo'&&u>=quota[s.id]) continue;\n    if(!ignoreCap&&!eve&&u>=S.maxPerDay) continue;\n    var win=Math.max(1,f.Ps[f.endIdx+1]-f.Ps[i]-k);\n    var sc=(f.rem/win)*(0.6+0.2*s.imp)*(eve?1.5:1);\n    if(sc>bs+1e-9||(Math.abs(sc-bs)<=1e-9&&b&&s.exam<b.exam)){bs=sc;b=s}\n  }\n  return b;\n}\nfunction computePlan(){\n  attr=attribution();\n  var S=P.settings, t=today(), subs=P.evals, Wm=W();\n  var last=t; subs.forEach(function(s){if(s.exam>last)last=s.exam});\n  var n=Math.max(diff(t,last)+1,14), days=[], cap=[], i;\n  for(i=0;i<n;i++){var d=addD(t,i);days.push(d);cap.push(dayCap(d))}\n  var info={}, alloc=days.map(function(){return {}}), capLeft=cap.slice();\n  subs.forEach(function(s){\n    var needB=Math.ceil(hB(s.hours)-1e-9), dB=doneB(s), dt=(attr[s.id].today)/Wm;\n    var rem=Math.max(0,needB-(dB-dt)), ex=diff(t,s.exam);\n    var st=s.from?Math.max(0,diff(t,s.from)):0, en=ex-1; if(s.to) en=Math.min(en,diff(t,s.to));\n    info[s.id]={needB:needB,doneB:dB,doneToday:dt,rem:rem,remStart:rem,examIdx:ex,startIdx:st,endIdx:en,Ps:[0],finish:null,studyDays:0,planned:0};\n  });\n  subs.forEach(function(s){\n    if(!s.manual) return; var f=info[s.id];\n    for(var j=0;j<n;j++){var hh=manualHours(s,days[j],j,f);if(hh>0){var b=hB(hh);alloc[j][s.id]=b;f.planned+=b;capLeft[j]=Math.max(0,capLeft[j]-b);f.finish=j}}\n    f.rem=Math.max(0,f.remStart-f.planned); if(f.rem<0.05) f.rem=0;\n  });\n  var capA=capLeft.map(function(c){return Math.floor(c+1e-9)});\n  subs.forEach(function(s){\n    if(s.manual) return; var f=info[s.id];\n    for(var j=0;j<n;j++){var ok=j>=f.startIdx&&j<=f.endIdx&&dayAllowed(s,days[j]);f.Ps.push(f.Ps[j]+(ok?capA[j]:0))}\n  });\n  for(i=0;i<n;i++){\n    var c=capA[i]; if(!c) continue;\n    var cand=subs.filter(function(s){var f=info[s.id];return !s.manual&&f.rem>0&&i>=f.startIdx&&i<=f.endIdx&&dayAllowed(s,days[i])});\n    if(!cand.length) continue;\n    var used={}, quota={};\n    if(S.mode==='parejo') cand.forEach(function(s){var f=info[s.id],sd=0;for(var j=i;j<=f.endIdx&&j<n;j++)if(f.Ps[j+1]>f.Ps[j])sd++;quota[s.id]=Math.ceil(f.rem/Math.max(sd,1))});\n    for(var k=0;k<c;k++){\n      var pick=best(cand,info,used,quota,i,k,false);\n      if(!pick&&S.mode!=='parejo') pick=best(cand,info,used,quota,i,k,true);\n      if(!pick) break;\n      var f=info[pick.id];\n      used[pick.id]=(used[pick.id]||0)+1; alloc[i][pick.id]=(alloc[i][pick.id]||0)+1;\n      f.planned++; f.rem--; if(f.rem<=0){f.rem=0;f.finish=i}\n    }\n  }\n  subs.forEach(function(s){\n    var f=info[s.id], sd=0;\n    for(var j=0;j<Math.min(f.examIdx,n);j++) if(alloc[j][s.id]) sd++;\n    f.studyDays=sd;\n    if(f.examIdx<0) f.status='pasado';\n    else if(f.needB>0&&f.doneB>=f.needB) f.status='listo';\n    else if(f.examIdx===0) f.status='hoy';\n    else if(s.manual&&f.needB===0) f.status='manual';\n    else if(f.needB===0) f.status='listo';\n    else if(f.rem>0) f.status='riesgo';\n    else if(!s.manual&&f.finish!==null&&f.examIdx-f.finish<=1) f.status='ajustado';\n    else f.status='ok';\n  });\n  plan={today:t,days:days,cap:cap,alloc:alloc,info:info};\n}\nfunction sorted(){return P.evals.slice().sort(function(a,b){return a.exam<b.exam?-1:a.exam>b.exam?1:b.imp-a.imp})}\nfunction overlaps(e,p){\n  var out=[], t=today();\n  P.evals. tener('click', function(ev){\n  var el = ev.target.closest && ev.target.closest('[data-ms]');\n  if (!el) { if (ev.target && ev.target.id === 'ms-modal') closePanel(); return; }\n  var a = el.dataset.ms;\n  if (a !== 'restore') armed.restore = false;\n  if (a !== 'disconnect') armed.off = false;\n  switch (a) {\n    case 'close': closePanel(); return;\n    case 'connect': var t = document.getElementById('msTok'); connect(t ? t.value : ''); return;\n    case 'useRemote':\n      if (!pending) return;\n      if (pending.kind === 'choose') saveConn(pending.tk, pending.login, pending.id);\n      var rm = pending.remote; pending = null; applyRemote(rm, true); return;\n    case 'useLocal':\n      if (!pending) return;\n      if (pending.kind === 'choose') saveConn(pending.tk, pending.login, pending.id);\n      var rl = pending.remote; pending = null; status = 'sync'; pushLocalOver(rl).then(drawPanel); return;\n    case 'now': syncNow(); return;\n    case 'retoken': var nt = document.getElementById('msTok'); if (nt && nt.value.trim()) { s(K_TOKEN, nt.value.trim()); setStatus('sync',''); syncNow(); } return;\n    case 'restore':\n      if (!armed.restore) { armed.restore = true; drawPanel(); return; }\n      var bk = null; try { bk = JSON.parse(g(K_BACKUP)||'null'); } catch(_){}\n      if (!bk || !bk.data) return;\n      var cur = collect(); writeAll(bk.data); backup('antes de restaurar', cur);\n      changeSeq++; meta.dirty = true; meta.changedAt = meta.firstDirtyAt = Date.now(); saveMeta();\n      toast('↩︎ Copia restaurada'); setTimeout(function(){ location.reload(); }, 600); return;\n    case 'disconnect':\n      if (!armed.off) { armed.off = true; drawPanel(); return; }\n      r(K_TOKEN); r(K_GIST); r(K_USER); meta = { dirty: !!meta.dirty, changedAt: meta.changedAt }; saveMeta();\n      armed = {}; pending = { kind:'form' }; setStatus('off', ''); drawPanel(); toast('Nube desconectada en este dispositivo'); return;\n  }\n});\ndocument.addEventListener('keydown', function(ev){\n  var m = document.getElementById('ms-modal'); if (!m || m.hidden) return;\n  if (ev.key === 'Escape') closePanel();\n  if (ev.key === 'Enter' && ev.target && ev.target.id === 'msTok') { ev.preventDefault(); var b = m.querySelector('[data-ms=\"connect\"],[data-ms=\"retoken\"]'); if (b) b.click(); }\n});\n\n/* ---------- arranque ---------- */\nfunction start(){\n  setStatus(connected() ? (meta.dirty ? 'pending' : 'ok') : 'off');\n  if (connected()) setTimeout(syncNow, 1200);\n  window.addEventListener('online', function(){ if (connected()) syncNow(); });\n  document.addEventListener('visibilitychange', function(){ if (connected() && document.visibilityState === 'visible') syncNow(); else if (connected() && meta.dirty) syncNow(); });\n  setInterval(function(){ if (connected() && document.visibilityState === 'visible' && !busy) syncNow(); }, 45000);\n  setInterval(function(){ if (!chip || !chip.isConnected) setStatus(status); }, 3000);\n}\nif (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();\n})();\n\n<\u002Fscript>\n<\u002Fbody><\u002Fhtml>"
