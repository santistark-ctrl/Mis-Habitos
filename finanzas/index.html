<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mis Finanzas</title>
<style>
:root{
  --fondo:#10131c; --sup:#181c29; --sup2:#212638; --linea:#2c3247;
  --tinta:#ebe7dc; --tenue:#9498ad; --oro:#f2c14e; --oro-osc:#3a3115;
  --favor:#5fd0a4; --contra:#ff8585;
  --num:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --txt:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--fondo);color-scheme:dark}
body{margin:0;background:var(--fondo);color:var(--tinta);font:15px/1.45 var(--txt);min-height:100vh;
  padding:0 0 calc(86px + env(safe-area-inset-bottom));overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.num{font-family:var(--num);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
.tenue{color:var(--tenue)} .favor{color:var(--favor)} .contra{color:var(--contra)}

/* estructura */
.app{max-width:600px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 0 10px}
header.top h1{flex:1;margin:0;font:600 22px/1.2 var(--num)}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:17px;background:var(--sup);border:1px solid var(--linea);font-size:13px;color:var(--tenue)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--tenue)}
.chip.ok i{background:var(--favor)} .chip.mal i{background:var(--contra)} .chip.va i{background:var(--oro)}
.icono{width:34px;height:34px;border-radius:17px;background:var(--sup);border:1px solid var(--linea);font-size:16px}

nav.abajo{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(16,19,28,.94);backdrop-filter:blur(10px);border-top:1px solid var(--linea);
  display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.abajo button{flex:1;max-width:120px;padding:6px 2px;border-radius:12px;color:var(--tenue);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.abajo button span{font-size:20px;line-height:1.1;filter:grayscale(1) opacity(.7)}
nav.abajo button.on{color:var(--oro)} nav.abajo button.on span{filter:none}
.mas{position:fixed;right:max(16px,calc(50% - 284px));bottom:calc(78px + env(safe-area-inset-bottom));z-index:21;width:58px;height:58px;border-radius:50%;
  background:var(--oro);color:#1d1705;font:400 34px/1 var(--txt);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.mas:active{transform:scale(.95)}

/* ticket: el resumen principal, con borde troquelado */
.ticket{background:var(--sup);padding:20px 18px 24px;margin:6px 0 18px;
  --d:radial-gradient(circle at 8px 100%,transparent 6px,#000 6.5px);
  -webkit-mask:linear-gradient(#000,#000) top/100% calc(100% - 8px) no-repeat,var(--d) bottom left/16px 8px repeat-x;
          mask:linear-gradient(#000,#000) top/100% calc(100% - 8px) no-repeat,var(--d) bottom left/16px 8px repeat-x;
  border-radius:14px 14px 0 0}
.ticket .mes{color:var(--tenue);font-size:13px}
.ticket .total{font:600 44px/1.05 var(--num);font-variant-numeric:tabular-nums lining-nums;margin:2px 0 14px;color:var(--oro);overflow-wrap:anywhere}
.renglon{display:flex;align-items:baseline;gap:8px;padding:5px 0}
.renglon .guia{flex:1;border-bottom:1.5px dotted var(--linea);transform:translateY(-4px);min-width:16px}
.renglon b{font:600 16px var(--num);font-variant-numeric:tabular-nums}

h2{font:600 17px/1.3 var(--num);margin:22px 0 8px;display:flex;align-items:baseline;gap:8px}
h2 small{font:400 13px var(--txt);color:var(--tenue);margin-left:auto}
h2 button{margin-left:auto;font:500 13px var(--txt);color:var(--oro)}
.tarjeta{background:var(--sup);border-radius:14px;padding:4px 14px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dos>*{background:var(--sup);border-radius:14px;padding:12px 14px;text-align:left;display:block}
.dos b{display:block;font:600 21px var(--num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.fila{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 0;border-bottom:1px solid var(--linea)}
.fila:last-child{border-bottom:0}
.fila .em{flex:0 0 36px;height:36px;border-radius:10px;background:var(--sup2);display:grid;place-items:center;font-size:18px}
.fila .med{flex:1;min-width:0}
.fila .med div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .med small{display:block;color:var(--tenue);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .der{text-align:right;font:600 15.5px var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fila .der small{display:block;font:400 12px var(--txt);color:var(--tenue)}
.dia{display:flex;justify-content:space-between;color:var(--tenue);font-size:12.5px;margin:16px 2px 4px}
.vacio{color:var(--tenue);text-align:center;padding:26px 10px}
.vacio b{display:block;color:var(--tinta);font:600 16px var(--num);margin-bottom:4px}

/* controles */
.barra{display:flex;gap:8px;align-items:center;margin:4px 0 10px;flex-wrap:wrap}
.mesnav{display:flex;align-items:center;gap:2px;background:var(--sup);border-radius:12px;padding:3px}
.mesnav button{width:34px;height:34px;border-radius:9px;font-size:18px;color:var(--tenue)}
.mesnav b{min-width:128px;text-align:center;font:600 15px var(--num)}
.seg{display:flex;background:var(--sup);border-radius:12px;padding:3px;margin-left:auto}
.seg button{padding:7px 13px;border-radius:9px;color:var(--tenue);font-size:13.5px}
.seg button.on{background:var(--sup2);color:var(--tinta)}
input[type=text],input[type=search],input[type=date],input[type=password],input[inputmode],select,textarea{
  width:100%;background:var(--sup2);border:1px solid var(--linea);border-radius:11px;padding:11px 12px;min-height:44px;color:var(--tinta)}
input::placeholder{color:#6d7187}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tenue) 50%),linear-gradient(135deg,var(--tenue) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.filtros{display:grid;grid-template-columns:1fr 150px;gap:8px;margin-bottom:6px}
.marca{display:inline-flex;align-items:center;gap:7px;color:var(--tenue);font-size:13px;margin:2px 0 4px}
.marca input{width:18px;height:18px;accent-color:var(--oro)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;background:var(--oro);color:#1d1705;font-weight:600}
.btn.sec{background:var(--sup2);color:var(--tinta);font-weight:500}
.btn.pel{background:none;color:var(--contra);font-weight:500}
.btn.ch{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.fila-btn{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.fila-btn .btn{flex:1}

/* barras de categorías y presupuesto */
.cat{padding:10px 0;border-bottom:1px solid var(--linea)} .cat:last-child{border-bottom:0}
.cat .cab{display:flex;gap:8px;align-items:baseline}
.cat .cab span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .cab b{font:600 15px var(--num);font-variant-numeric:tabular-nums}
.cat .cab small{color:var(--tenue);width:38px;text-align:right;font-size:12.5px}
.pista{height:8px;border-radius:4px;background:var(--sup2);margin-top:6px;overflow:hidden}
.pista i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--oro);min-width:2px}
.pista.presu i{background:var(--favor)} .pista.presu.pasado i{background:var(--contra)}
.nota{color:var(--tenue);font-size:12.5px;margin-top:4px}
.comp{display:inline-block;padding:2px 9px;border-radius:10px;font-size:13px;background:var(--sup2)}

/* hoja inferior */
.velo{position:fixed;inset:0;z-index:40;background:rgba(5,6,10,.66);display:flex;align-items:flex-end;justify-content:center}
.hoja{width:100%;max-width:600px;max-height:92vh;overflow:auto;background:var(--sup);border-radius:20px 20px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:sube .18s ease-out}
@keyframes sube{from{transform:translateY(24px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.hoja{animation:none}}
.hoja .cabeza{display:flex;align-items:center;gap:8px;position:sticky;top:-8px;background:var(--sup);padding:12px 0 8px;z-index:2}
.hoja .cabeza h3{flex:1;margin:0;font:600 19px var(--num)}
.hoja .cabeza button{width:36px;height:36px;border-radius:18px;background:var(--sup2);color:var(--tenue);font-size:16px}
label.c{display:block;margin:10px 0 0;font-size:13px;color:var(--tenue)}
label.c>input,label.c>select,label.c>textarea{margin-top:5px}
.monto{font:600 30px var(--num)!important;text-align:left;padding:10px 12px!important;color:var(--oro)!important}
.par{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.elige{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.elige label{position:relative}
.elige input{position:absolute;opacity:0;pointer-events:none}
.elige span{display:inline-flex;align-items:center;gap:5px;padding:8px 11px;border-radius:11px;background:var(--sup2);border:1px solid var(--linea);font-size:13.5px;color:var(--tinta)}
.elige input:checked+span{background:var(--oro-osc);border-color:var(--oro);color:var(--oro)}
.elige input:focus-visible+span{outline:2px solid var(--oro);outline-offset:2px}
.saldo{font:600 34px var(--num);font-variant-numeric:tabular-nums;margin:2px 0 2px;overflow-wrap:anywhere}
.aviso{background:var(--sup2);border-radius:11px;padding:10px 12px;font-size:13.5px;color:var(--tenue);margin:10px 0}
.tostada{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--tinta);color:#14161f;padding:10px 16px;border-radius:12px;font-weight:500;max-width:88vw;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.it{display:grid;grid-template-columns:64px 12px 1fr auto 36px;gap:6px;align-items:center;padding:9px 0;border-bottom:1px solid var(--linea)}
.it:last-child{border-bottom:0}
.it .itn{grid-column:1/-1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it input{min-height:40px;padding:8px 10px}
.it b{font:600 15px var(--num);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:74px;text-align:right}
#items select{margin-top:8px} #items .tarjeta{background:var(--sup2);margin-top:6px} #items .tarjeta input{background:var(--sup)}
#itNuevo{grid-template-columns:1fr 104px auto;margin-top:8px}
input[readonly]{opacity:.85;border-style:dashed}
svg.linea{display:block;width:100%;height:84px;margin:8px 0 2px}

@media (min-width:900px){
  body{padding-bottom:30px}
  nav.abajo{top:0;bottom:0;right:auto;width:200px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--linea);padding:86px 12px 12px;backdrop-filter:none;background:var(--fondo)}
  nav.abajo button{flex:0;max-width:none;width:100%;flex-direction:row;gap:12px;padding:11px 12px;font-size:14.5px}
  .app{padding-left:216px;max-width:860px}
  .mas{right:auto;left:calc(50% + 330px);bottom:34px}
  .velo{align-items:center} .hoja{border-radius:20px;max-height:88vh}
  .tostada{bottom:40px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 id="titulo">Mis Finanzas</h1>
    <button class="chip" id="nube" data-a="ajustes" aria-label="Sincronización"><i></i><span>Sin nube</span></button>
    <button class="icono" data-a="ajustes" aria-label="Ajustes">⚙</button>
  </header>
  <main id="vista"></main>
</div>
<button class="mas" data-a="nuevoGasto" aria-label="Agregar gasto">+</button>
<nav class="abajo" id="nav"></nav>
<div id="hoja"></div>
<div id="tostada" class="tostada" hidden role="status"></div>

<script>
(function(){
'use strict';
var PFX='mis-finanzas:', K_DATA=PFX+'data', K_TOKEN=PFX+'token', K_GIST=PFX+'gist', K_LAST=PFX+'ultima-sync';
var K_TOKEN_HAB='rastreador-habitos:sync-token';
var FILE='mis-finanzas-sync.json', API='https://api.github.com';
var COLS=['gastos','cats','prods','precios','personas','movs','fijos'];
var MEDIOS=['Efectivo','Débito','Crédito','Transferencia','Mercado Pago'];
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var CATS0=[['comida','Comida','🍔'],['super','Supermercado','🛒'],['transporte','Transporte','🚌'],['facultad','Facultad','🎓'],['salidas','Salidas','🎉'],
  ['suscripciones','Suscripciones','📺'],['salud','Salud','💊'],['ropa','Ropa','👕'],['hogar','Hogar','🏠'],['otros','Otros','📦']];
var TABS=[['inicio','Inicio','🧾'],['gastos','Gastos','💸'],['fijos','Fijos','🔁'],['precios','Precios','🏷️'],['deudas','Deudas','🤝']];

/* ---------- utilidades ---------- */
var LS=window.localStorage;
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function p2(n){return (n<10?'0':'')+n}
function clave(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function hoy(){return clave(new Date())}
function fecha(k){var a=k.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function esFecha(k){return typeof k==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(k)&&!isNaN(fecha(k).getTime())}
function sumaDias(k,n){var d=fecha(k);d.setDate(d.getDate()+n);return clave(d)}
function lunes(k){var d=fecha(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return clave(d)}
function mesDe(k){return k.slice(0,7)}
function mesSuma(m,n){var a=m.split('-'),d=new Date(+a[0],+a[1]-1+n,1);return d.getFullYear()+'-'+p2(d.getMonth()+1)}
function mesNombre(m){var a=m.split('-');return MESES[+a[1]-1].charAt(0).toUpperCase()+MESES[+a[1]-1].slice(1)+' '+a[0]}
function fCorta(k){var d=fecha(k);return d.getDate()+' '+MESES[d.getMonth()].slice(0,3)+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')}
function fDia(k){var h=hoy();if(k===h)return 'Hoy';if(k===sumaDias(h,-1))return 'Ayer';var d=fecha(k);return DIAS[d.getDay()].charAt(0).toUpperCase()+DIAS[d.getDay()].slice(1)+' '+d.getDate()+' de '+MESES[d.getMonth()]}
var fmtN=new Intl.NumberFormat('es-AR',{maximumFractionDigits:2});
function plata(n){n=Math.round((+n||0)*100)/100;return (n<0?'−':'')+'$ '+fmtN.format(Math.abs(n))}
function aNum(s){
  s=String(s==null?'':s).replace(/[^\d.,-]/g,'');if(!s)return NaN;
  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  var n=parseFloat(s);return isFinite(n)?Math.round(n*100)/100:NaN;
}
function pct(a,b){return b>0?Math.round((a-b)/b*100):null}
function tostada(t){var e=$('#tostada');e.textContent=t;e.hidden=false;clearTimeout(tostada.t);tostada.t=setTimeout(function(){e.hidden=true},2600)}

/* ---------- datos ---------- */
var DB=null;
function vacia(){var d={v:1,cfg:{presu:0,upd:0}};COLS.forEach(function(c){d[c]={}});return d}
function sembrar(d){CATS0.forEach(function(c,i){var id='c-'+c[0];if(!d.cats[id])d.cats[id]={id:id,nombre:c[1],emoji:c[2],presu:0,orden:i,upd:1}})}
function normal(raw){
  var d=vacia();
  if(raw&&typeof raw==='object'){
    COLS.forEach(function(c){var o=raw[c];if(o&&typeof o==='object')Object.keys(o).forEach(function(id){var r=o[id];if(r&&typeof r==='object'&&r.id===id)d[c][id]=r})});
    if(raw.cfg&&typeof raw.cfg==='object')d.cfg={presu:+raw.cfg.presu||0,upd:+raw.cfg.upd||0};
  }
  sembrar(d);return d;
}
function cargar(){try{DB=normal(JSON.parse(LS.getItem(K_DATA)||'null'))}catch(e){DB=normal(null)}}
function guardarLocal(){try{LS.setItem(K_DATA,JSON.stringify(DB))}catch(e){tostada('No se pudo guardar: el almacenamiento está lleno')}}
function guardar(){guardarLocal();pintar();programarSync(2500)}
function vivos(c){return Object.keys(DB[c]).map(function(id){return DB[c][id]}).filter(function(r){return !r.del})}
function pon(c,r){if(!r.id)r.id=uid();r.upd=Date.now();delete r.del;DB[c][r.id]=r;return r}
function borra(c,id){var r=DB[c][id];if(r){DB[c][id]={id:id,del:1,upd:Date.now()}}}
/* combina otra copia: por cada registro gana el modificado más tarde. Devuelve qué lado tenía algo nuevo. */
function combinar(otra){
  var cambioLocal=false,localNuevo=false;otra=normal(otra);
  COLS.forEach(function(c){
    Object.keys(otra[c]).forEach(function(id){var r=otra[c][id],l=DB[c][id];if(!l||(+r.upd||0)>(+l.upd||0)){DB[c][id]=r;cambioLocal=true}});
    Object.keys(DB[c]).forEach(function(id){var r=otra[c][id],l=DB[c][id];if(!r||(+l.upd||0)>(+r.upd||0))localNuevo=true});
  });
  if(otra.cfg.upd>DB.cfg.upd){DB.cfg=otra.cfg;cambioLocal=true}else if(DB.cfg.upd>otra.cfg.upd)localNuevo=true;
  return {cambioLocal:cambioLocal,localNuevo:localNuevo};
}

function cats(){return vivos('cats').sort(function(a,b){return (a.orden||0)-(b.orden||0)||a.nombre.localeCompare(b.nombre)})}
function cat(id){var c=DB.cats[id];return c&&!c.del?c:(DB.cats['c-otros']&&!DB.cats['c-otros'].del?DB.cats['c-otros']:{id:'c-otros',nombre:'Otros',emoji:'📦',presu:0})}
function gastos(){return vivos('gastos')}
function gastosMes(m){return gastos().filter(function(g){return mesDe(g.fecha)===m})}
function suma(a){return a.reduce(function(t,g){return t+(+g.monto||0)},0)}

/* ---------- gastos fijos ---------- */
function diasMes(y,m){return new Date(y,m+1,0).getDate()}
/* fechas de cobro de un fijo desde su inicio hasta `hasta` (incluido), más la siguiente */
function cobros(f,hasta){
  var ini=fecha(f.inicio),y=ini.getFullYear(),m=ini.getMonth(),paso=f.frec==='anual'?12:1,out=[],prox=null,n=0;
  while(n++<600){
    var k=clave(new Date(y,m,Math.min(f.dia,diasMes(y,m))));
    if(k>=f.inicio){if(k<=hasta)out.push(k);else{prox=k;break}}
    m+=paso;y+=Math.floor(m/12);m%=12;
  }
  return {hechos:out,prox:prox};
}
function generarFijos(){
  var h=hoy(),hubo=false;
  vivos('fijos').forEach(function(f){
    if(f.activo===false||!esFecha(f.inicio))return;
    cobros(f,h).hechos.forEach(function(k){
      var id='fx-'+f.id+'-'+mesDe(k);
      if(DB.gastos[id])return;            /* ya registrado (o borrado a mano): no se repite */
      DB.gastos[id]={id:id,monto:f.monto,cat:f.cat,fecha:k,medio:f.medio||'',nota:f.nombre,fijo:f.id,upd:Date.now()};hubo=true;
    });
  });
  return hubo;
}
function proximoCobro(f){if(f.activo===false||!esFecha(f.inicio))return null;return cobros(f,hoy()).prox}
function fijosMensual(){return vivos('fijos').filter(function(f){return f.activo!==false}).reduce(function(t,f){return t+(f.frec==='anual'?f.monto/12:f.monto)},0)}

function barraPresu(gastado,presu,texto){
  if(!(presu>0))return '';

function gastosFiltrados(){
  var q=S.q.trim().toLowerCase();

    if(!S.todo&&mesDe(g.fecha)!==S.mes)return false;
    if(S.fcat&&cat(g.cat).id!==S.fcat)return false;
    if(q&&(g.nota||'').toLowerCase().indexOf(q)<0&&cat(g.cat).nombre.toLowerCase().indexOf(q)<0&&(g.medio||'').toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){return a.fecha<b.fecha?1:a.fecha>b.fecha?-1:(b.upd||0)-(a.upd||0)});

function listaGastos(){

function resumenGastos(){

        '<div class="pista" role="img" aria-label="'+esc(x.c.nombre+': '+plata(x.t))+'"><i style="width:'+(x.t/max*100).toFixed(1)+'%"></i></div>'+barraPresu(x.t,x.c.presu,'Presupuesto de '+x.c.nombre)+'</div>'}).join('')+'</div>':

function grafico(h){
  if(h.length<2)return '';
  var W=320,H=84,px=6,py=12,min=Math.min.apply(null,h.map(function(p){return p.monto})),max=Math.max.apply(null,h.map(function(p){return p.monto}));
  var t0=fecha(h[0].fecha).getTime(),t1=fecha(h[h.length-1].fecha).getTime(),dt=Math.max(1,t1-t0),dv=Math.max(1e-9,max-min);
  var pts=h.map(function(p,i){var x=t1===t0?px+(W-2*px)*i/(h.length-1):px+(W-2*px)*(fecha(p.fecha).getTime()-t0)/dt,y=H-py-(H-2*py)*(p.monto-min)/dv;return [x,y]});
  return '<svg class="linea" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Evolución del precio: de '+esc(plata(h[0].monto))+' a '+esc(plata(h[h.length-1].monto))+'">'+
    '<polyline fill="none" stroke="#f2c14e" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'"/>'+
    pts.map(function(p,i){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(i===pts.length-1?4:2.5)+'" fill="#f2c14e" stroke="#181c29" stroke-width="2" vector-effect="non-scaling-stroke"><title>'+esc(fCorta(h[i].fecha)+': '+plata(h[i].monto))+'</title></circle>'}).join('')+'</svg>';
}
function hojaProd(id){

  var h=preciosDe(id),u=h[h.length-1],pr=h[0],v=h.length>1?pct(u.monto,pr.monto):null;
  var porLugar={};h.forEach(function(x){if(x.lugar)porLugar[x.lugar.toLowerCase()]=x});
  var lug=Object.keys(porLugar).map(function(k){return porLugar[k]}).sort(function(a,b){return a.monto-b.monto});
  abrir(p.nombre,(u?'<div class="tenue">Último precio</div><div class="saldo" style="color:var(--oro)">'+plata(u.monto)+'</div>'+
      (v!=null?'<span class="comp '+(v>0?'contra':v<0?'favor':'tenue')+'">'+(v>0?'▲ Subió ':v<0?'▼ Bajó ':'Igual, ')+Math.abs(v)+'% desde el '+fCorta(pr.fecha)+' ('+plata(pr.monto)+')</span>':'')+grafico(h):'<div class="aviso">Todavía no tiene precios.</div>')+
    '<div class="fila-btn"><button class="btn" data-a="nuevoPrecio" data-id="'+esc(id)+'">Agregar precio</button></div>'+
    (lug.length>1?'<h2>Dónde conviene</h2><div class="tarjeta">'+lug.map(function(x,i){return '<div class="fila"><span class="em">'+(i===0?'🥇':'📍')+'</span><span class="med"><div>'+esc(x.lugar)+'</div><small>'+fCorta(x.fecha)+(i===0?', el más barato':'')+'</small></span><span class="der">'+plata(x.monto)+'</span></div>'}).join('')+'</div>':'')+
    (h.length?'<h2>Historial</h2><div class="tarjeta">'+h.slice().reverse().map(function(x,i,arr){var prev=arr[i+1],d=prev?pct(x.monto,prev.monto):null;
      return '<div class="fila"><span class="med"><div>'+fCorta(x.fecha)+(x.lugar?', '+esc(x.lugar):'')+'</div><small>'+(d==null?'Primer registro':d===0?'Sin cambio':(d>0?'▲ ':'▼ ')+Math.abs(d)+'% contra el anterior')+'</small></span><span class="der">'+plata(x.monto)+'</span>'+
        '<button class="btn pel ch" data-a="borrarPrecio" data-id="'+esc(x.id)+'" data-p="'+esc(id)+'" aria-label="Borrar este precio">✕</button></div>'}).join('')+'</div>':'')+
    '<div class="fila-btn"><button class="btn sec" data-a="renombrarProd" data-id="'+esc(id)+'">Cambiar nombre</button><button class="btn pel" data-a="borrarProd" data-id="'+esc(id)+'">Borrar producto</button></div>');
}

    f=Object.assign({},f,{nombre:o.nombre.trim(),monto:n,frec:o.frec==='anual'?'anual':'mensual',inicio:o.inicio,dia:d.getDate(),mes:d.getMonth(),cat:o.cat||'c-suscripciones',medio:o.medio||''});
    pon('fijos',f);var hubo=generarFijos();cerrar();guardar();tostada(hubo?'Guardado, y anoté el cobro que ya correspondía':'Gasto fijo guardado')},
  prod:function(o,form){var n=montoDe(o,form);if(n==null||!o.nombre.trim()||!esFecha(o.fecha))return;
    var p=pon('prods',{nombre:o.nombre.trim()});pon('precios',{prod:p.id,monto:n,lugar:(o.lugar||'').trim(),fecha:o.fecha});
    if(o.compre)gastoDeCompra(o,n,p.nombre);cerrar();guardar();tostada(o.compre?'Producto guardado y gasto anotado':'Producto guardado')},
  precio:function(o,form){var n=montoDe(o,form);if(n==null||!esFecha(o.fecha))return;var id=form.dataset.id;
    pon('precios',{prod:id,monto:n,lugar:(o.lugar||'').trim(),fecha:o.fecha});if(o.compre)gastoDeCompra(o,n,DB.prods[id].nombre);
    guardar();hojaProd(id);tostada(o.compre?'Precio guardado y gasto anotado':'Precio guardado')},
  renProd:function(o,form){var p=DB.prods[form.dataset.id];if(!o.nombre.trim())return;p.nombre=o.nombre.trim();pon('prods',p);guardar();hojaProd(p.id)},
  persona:function(o){if(!o.nombre.trim())return;var p=personaPorNombre(o.nombre);guardar();hojaPersona(p.id)},
  renPersona:function(o,form){var p=DB.personas[form.dataset.id];if(!o.nombre.trim())return;p.nombre=o.nombre.trim();pon('personas',p);guardar();hojaPersona(p.id)},
  mov:function(o,form){var n=montoDe(o,form);if(n==null||!esFecha(o.fecha))return;var id=form.dataset.id;
    pon('movs',{persona:id,tipo:form.dataset.t,monto:n,motivo:(o.motivo||'').trim(),fecha:o.fecha});guardar();hojaPersona(id);
    var s=Math.round(saldo(id)*100)/100;tostada(s===0?'Listo: quedaron a mano':'Guardado')},
  presu:function(o){var n=aNum(o.presu);DB.cfg={presu:n>0?n:0,upd:Date.now()};guardar();hojaAjustes();tostada(n>0?'Presupuesto guardado':'Presupuesto quitado')},
  cat:function(o,form){if(!o.nombre.trim())return;var id=form.dataset.id,c=id?DB.cats[id]:{orden:cats().length},n=aNum(o.presu);
    c=Object.assign({},c,{nombre:o.nombre.trim(),emoji:(o.emoji||'🧩').trim()||'🧩',presu:n>0?n:0});pon('cats',c);guardar();hojaAjustes();tostada('Categoría guardada')},
  token:function(o){var t=(o.token||'').trim();if(!t)return;LS.setItem(K_TOKEN,t);Y.estado='';sincronizar(true).then(hojaAjustes)},
  dividir:function(o,form){var n=montoDe(o,form);if(n==null||!esFecha(o.fecha)||!o.nota.trim())return;
    var ids=[].concat(o.con||[]),nuevas=(o.nuevas||'').split(',').map(function(s){return s.trim()}).filter(Boolean).map(function(nm){return personaPorNombre(nm).id});
    ids=ids.concat(nuevas).filter(function(x,i,a){return a.indexOf(x)===i});
    if(!ids.length){tostada('Elegí al menos una persona');return}
    var pagador=o.pago==='nueva'?nuevas[0]:o.pago;
    if(o.pago==='nueva'&&!pagador){tostada('Escribí el nombre de quien pagó en "Otras personas"');return}
    if(pagador!=='yo'&&ids.indexOf(pagador)<0)ids.push(pagador);
    var parte=Math.round(n/(ids.length+1)*100)/100,nota=o.nota.trim();
    pon('gastos',{monto:parte,cat:o.cat||'c-otros',fecha:o.fecha,medio:pagador==='yo'?(o.medio||''):'',nota:nota+' (dividido entre '+(ids.length+1)+')'});
    if(pagador==='yo')ids.forEach(function(pid){pon('movs',{persona:pid,tipo:'presto',monto:parte,motivo:nota,fecha:o.fecha})});
    else pon('movs',{persona:pagador,tipo:'meprestaron',monto:parte,motivo:nota,fecha:o.fecha});
    cerrar();guardar();tostada(pagador==='yo'?'Tu parte: '+plata(parte)+'. Cada uno te debe '+plata(parte):'Tu parte: '+plata(parte)+'. Se la debés a '+DB.personas[pagador].nombre)}
};

/* ---------- eventos ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]');if(!el)return;
  var a=A[el.dataset.a];if(a){if(el.tagName==='BUTTON'&&el.type!=='submit')ev.preventDefault();a(el.dataset,el,ev)}
});
document.addEventListener('submit',function(ev){
  var form=ev.target.closest('form[data-f]');if(!form)return;ev.preventDefault();
  var o={};new FormData(form).forEach(function(v,k){if(k in o){o[k]=[].concat(o[k],v)}else o[k]=v});
  if(o.con!=null)o.con=[].concat(o.con);
  F[form.dataset.f](o,form);
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.dataset.k&&t.closest('#items')){var it=IT[+t.dataset.i];if(it){var v=aNum(t.value);it[t.dataset.k]=v>0?v:0;$('#its'+t.dataset.i).textContent=plata(it.cant*it.precio);montoItems()}}
  else if(t.name==='lugar'&&t.closest('#items'))ITL=t.value;
  else if(t.id==='q'){S.q=t.value;$('#lista').innerHTML=listaGastos()}
  else if(t.id==='pq'){S.pq=t.value;var q=S.pq.trim().toLowerCase();$('#plista').innerHTML=listaProds(vivos('prods').filter(function(p){return !q||p.nombre.toLowerCase().indexOf(q)>=0}).sort(function(a,b){return a.nombre.localeCompare(b.nombre)}))}
  else if(t.form&&t.form.dataset.f==='dividir')textoDividir(t.form);
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='itAdd'){
    if(t.value==='__nuevo'){$('#itNuevo').hidden=false;$('#itNom').focus()}
    else if(t.value){var pr=DB.prods[t.value],ya=IT.filter(function(i){return i.prod===pr.id})[0];if(ya)ya.cant=(+ya.cant||0)+1;else IT.push({prod:pr.id,nombre:pr.nombre,cant:1,precio:ultimoPrecio(pr.id)});pintarItems()}
  }
  else if(t.id==='fcat'){S.fcat=t.value;$('#lista').innerHTML=listaGastos()}
  else if(t.id==='todo'){S.todo=t.checked;$('#lista').innerHTML=listaGastos()}
  else if(t.id==='compre'){$('#compreMas').hidden=!t.checked}
  else if(t.id==='archivo'&&t.files[0]){var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(!j||j.app!=='mis-finanzas'||!j.data)throw 0;combinar(j.data);generarFijos();guardar();hojaAjustes();tostada('Datos importados y combinados con los que tenías')}catch(e){tostada('Ese archivo no es una copia de Mis Finanzas')}};r.readAsText(t.files[0]);t.value=''}
  else if(t.form&&t.form.dataset.f==='dividir')textoDividir(t.form);
});
function textoDividir(form){
  var n=aNum(form.monto.value),c=form.querySelectorAll('[name=con]:checked').length+form.nuevas.value.split(',').filter(function(s){return s.trim()}).length;
  $('#divTexto').textContent=n>0&&c>0?'Entre '+(c+1)+' personas: '+plata(Math.round(n/(c+1)*100)/100)+' cada una. Tu parte se anota como gasto.':'Se divide en partes iguales. Tu parte se anota como gasto.';
}
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&$('#hoja').firstChild)cerrar();
  else if(ev.key==='Enter'&&ev.target.closest&&ev.target.closest('#items')){ev.preventDefault();if(ev.target.id==='itNom'||ev.target.id==='itPre')A.itNuevo()}
});

/* ---------- sincronización (Gist privado, combinación automática por registro) ---------- */
var Y={estado:'',texto:'',ocupado:false,otra:false,t:null,revisado:false};
function token(){try{return LS.getItem(K_TOKEN)||LS.getItem(K_TOKEN_HAB)||''}catch(e){return ''}}
function pintarNube(){
  var e=$('#nube'),tk=token(),st=tk?(Y.estado||'va'):'';
  e.className='chip'+(st==='ok'?' ok':st==='mal'?' mal':st==='va'?' va':'');
  e.querySelector('span').textContent=!tk?'Sin nube':st==='ok'?'Al día':st==='mal'?'Sin subir':'Sincronizando';
  e.title=Y.texto||'';
}
function api(metodo,ruta,cuerpo){
  var ctl=new AbortController(),t=setTimeout(function(){ctl.abort()},20000);
  return fetch(ruta.indexOf('http')===0?ruta:API+ruta,{method:metodo,cache:'no-store',signal:ctl.signal,
    headers:ruta.indexOf('http')===0?{}:{'Authorization':'Bearer '+token(),'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:cuerpo?JSON.stringify(cuerpo):undefined})
    .then(function(r){clearTimeout(t);if(!r.ok){var e=new Error('http '+r.status);e.status=r.status;throw e}return r},function(e){clearTimeout(t);throw e});
}
function buscarGist(){
  var hallados=[];
  function pag(n){return api('GET','/gists?per_page=100&page='+n).then(function(r){return r.json()}).then(function(l){
    l.forEach(function(g){if(g.files&&g.files[FILE])hallados.push(g)});return l.length===100&&n<5?pag(n+1):null})}
  return pag(1).then(function(){hallados.sort(function(a,b){return a.created_at<b.created_at?-1:1});return hallados[0]?hallados[0].id:null});
}
function asegurarGist(){
  var id=LS.getItem(K_GIST);
  if(id&&Y.revisado)return Promise.resolve(id);
  /* una vez por sesión: si hay más de una copia en la cuenta, todos los dispositivos usan la más vieja */
  return buscarGist().then(function(viejo){
    Y.revisado=true;
    if(viejo){if(viejo!==id)LS.setItem(K_GIST,viejo);return viejo}
    var files={};files[FILE]={content:JSON.stringify(DB)};
    return api('POST','/gists',{description:'Mis Finanzas: sincronización (no borrar)',public:false,files:files}).then(function(r){return r.json()}).then(function(g){LS.setItem(K_GIST,g.id);return g.id});
  });
}
function leerGist(id){
  return api('GET','/gists/'+id).then(function(r){return r.json()}).then(function(g){
    var f=g.files&&g.files[FILE];if(!f)return {falta:true};
    var txt=f.truncated?api('GET',f.raw_url).then(function(r){return r.text()}):Promise.resolve(f.content);
    return txt.then(function(s){var j=JSON.parse(s);if(!j||typeof j!=='object')throw new Error('contenido inválido');return {data:j}});
  });
}
function sincronizar(aMano){
  if(!token()){Y.estado='';Y.texto='';pintarNube();return Promise.resolve()}
  if(Y.ocupado){Y.otra=true;return Promise.resolve()}
  Y.ocupado=true;Y.otra=false;if(Y.estado!=='ok'||aMano){Y.estado='va';pintarNube()}
  return asegurarGist().then(function(id){
    return leerGist(id).then(function(rem){
      var r=rem.falta?{cambioLocal:false,localNuevo:true}:combinar(rem.data);
      if(r.cambioLocal){generarFijos();guardarLocal();if(!$('#hoja').firstChild||aMano)pintar();else Y.pintarLuego=true}
      if(!r.localNuevo)return;
      var files={};files[FILE]={content:JSON.stringify(DB)};
      return api('PATCH','/gists/'+id,{files:files});
    });
  }).then(function(){
    Y.estado='ok';Y.texto='Tus datos están al día en la nube.';LS.setItem(K_LAST,String(Date.now()));if(aMano)tostada('Sincronizado');
  },function(e){
    Y.estado='mal';
    Y.texto=e&&e.status===401?'El token no es válido o venció.':e&&e.status===403?'GitHub rechazó el pedido: revisá que el token tenga permiso gist.':e&&e.status===404?'No encontré la copia en la nube.':e&&e.status?'GitHub respondió con un error ('+e.status+').':'Sin conexión: se sube cuando vuelva.';
    if(e&&e.status===404){LS.removeItem(K_GIST);Y.revisado=false}
    if(aMano)tostada(Y.texto);
  }).then(function(){Y.ocupado=false;pintarNube();if(Y.otra)programarSync(400)});
}
function programarSync(ms){if(!token())return;if(Y.estado!=='mal'){Y.estado='va';pintarNube()}clearTimeout(Y.t);Y.t=setTimeout(sincronizar,ms)}
new MutationObserver(function(){if(Y.pintarLuego&&!$('#hoja').firstChild){Y.pintarLuego=false;pintar()}}).observe($('#hoja'),{childList:true});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){revisarDia();sincronizar()}});
window.addEventListener('online',function(){sincronizar()});
window.addEventListener('storage',function(e){if(e.key===K_DATA){cargar();pintar()}});
setInterval(function(){if(document.visibilityState==='visible'){revisarDia();sincronizar()}},60000);

/* al cambiar el día: anotar los fijos que vencieron y refrescar */
var diaVisto=hoy();
function revisarDia(){var h=hoy();if(h===diaVisto)return;diaVisto=h;if(generarFijos())guardar();else pintar()}

/* ---------- arranque ---------- */
cargar();
if(generarFijos())guardarLocal();
pintar();
sincronizar();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('../sw.js').catch(function(){})}
window.__fin={db:function(){return DB},estado:function(){return Y},sincronizar:sincronizar};
})();
</script>
